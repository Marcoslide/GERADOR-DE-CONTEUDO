  // ============================================================
  let libCat = "Todos";
  function biblioteca() {
    const st = S.get();
    const cats = ["Todos", ...Array.from(new Set(st.library.map((l) => l.type)))];
    const items = st.library.filter((l) => libCat === "Todos" || l.type === libCat);
    const catsHTML = cats.map((c) => `<span class="chip ${c === libCat ? "on" : ""}" data-libcat="${esc(c)}">${esc(c)}</span>`).join("");
    const cardsHTML = items.map((l) => `
      <div class="item-card">
        <div class="ic-top"><div class="ic-thumb">${libIco(l.type)}</div><div style="flex:1"><div class="ic-title">${esc(l.title)}</div><span class="pill pill-accent" style="margin-top:4px">${esc(l.type)}</span></div>
          <div class="x-btn" data-dellib="${l.id}" title="Excluir">🗑️</div></div>
        <div class="ic-desc">${esc(l.content)}</div>
        <div class="ic-foot">${(l.tags || []).map((t) => `<span class="pill pill-gray">#${esc(t)}</span>`).join("")}
          <button class="btn btn-xs" data-reuse="${l.id}" style="margin-left:auto">Reutilizar</button></div>
      </div>`).join("");
    return `
      <div class="section-title"><span class="st-ico">📚</span><h2>Biblioteca</h2><span class="st-count">${st.library.length} itens reutilizáveis</span>
        <div class="st-actions"><button class="btn btn-primary btn-sm" data-act="new-lib">+ Adicionar</button></div></div>
      <p class="muted" style="margin-bottom:14px">Ganchos, roteiros, criativos e aprendizados vencedores. A IA usa a biblioteca para sugerir novos conteúdos.</p>
      <div class="lib-cats">${catsHTML}</div>
      <div class="grid grid-auto">${cardsHTML || emptyState("📚", "Nada nesta categoria", "")}</div>`;
  }
  function bindBiblioteca(root) {
    root.querySelectorAll("[data-libcat]").forEach((el) => el.onclick = () => { libCat = el.dataset.libcat; window.App.render(); });
    root.querySelectorAll("[data-dellib]").forEach((el) => el.onclick = (e) => { e.stopPropagation(); U.confirm("Excluir este item da biblioteca?", () => { S.actions.deleteLibrary(el.dataset.dellib); U.toast("Item excluído"); }, { danger: true, yes: "Excluir" }); });
    root.querySelectorAll("[data-reuse]").forEach((el) => el.onclick = () => U.simulated("Reutilizar item", "Item aplicado a um novo card de rascunho."));
    root.querySelectorAll("[data-act='new-lib']").forEach((el) => el.onclick = () => window.App.openLibForm());
  }

  // ============================================================
  // PERSONA
  // ============================================================
  function persona() {
    const p = S.get().persona;
    return `
      <div class="section-title"><span class="st-ico">🎭</span><h2>Persona</h2><span class="st-count">identidade da marca/operação</span>
        <div class="st-actions"><button class="btn btn-primary btn-sm" data-act="edit-persona">Editar persona</button></div></div>
      <div class="panel panel-pad" style="margin-bottom:16px">
        <div class="persona-hero">
          <div class="persona-avatar">${U.initials(p.brandName)}</div>
          <div><h1 style="font-size:22px;color:var(--text-0);font-weight:800">${esc(p.brandName)}</h1>
            <div class="flex gap-8 center wrap" style="margin-top:6px"><span class="pill pill-accent">${esc(p.userType)}</span><span class="pill pill-gray">${esc(p.niche)}</span></div>
            <p class="muted" style="margin-top:8px;max-width:640px">${esc(p.positioning)}</p></div>
        </div>
      </div>
      <div class="grid grid-2" style="align-items:start">
        <div class="info-block"><h4>👥 Público & tom</h4>
          <div class="kv">
            <div class="k">Público</div><div class="v">${esc(p.audience)}</div>
            <div class="k">Tom de voz</div><div class="v">${(p.tone || []).map((t) => `<span class="pill pill-gray">${esc(t)}</span>`).join(" ")}</div>
            <div class="k">Linguagem</div><div class="v">${esc(p.language)}</div>
            <div class="k">Objetivo</div><div class="v">${esc(p.objective)}</div>
          </div></div>
        <div class="info-block"><h4>🎯 Marca & limites</h4>
          <div class="kv">
            <div class="k">Promessa central</div><div class="v">${esc(p.promise)}</div>
            <div class="k">Produtos</div><div class="v">${esc(p.products)}</div>
            <div class="k">Canais</div><div class="v">${(p.channels || []).join(", ")}</div>
            <div class="k">Estilo visual</div><div class="v">${esc(p.visualStyle)}</div>
            <div class="k">Limites</div><div class="v">${esc(p.limits)}</div>
            <div class="k">Temas proibidos</div><div class="v">${esc(p.forbidden)}</div>
          </div></div>
      </div>`;
  }
  function bindPersona(root) { root.querySelectorAll("[data-act='edit-persona']").forEach((el) => el.onclick = () => window.App.openPersonaForm()); }

  // ============================================================
  // CONFIGURAÇÕES
  // ============================================================
  let setTab = "Conta";
  function config() {
    const st = S.get();
    const tabs = ["Conta", "Equipe", "Créditos de IA", "Integrações", "Status personalizados", "Notificações"];
    const nav = tabs.map((t) => `<div class="set-nav-item ${t === setTab ? "active" : ""}" data-settab="${esc(t)}">${esc(t)}</div>`).join("");
    let panel = "";
    if (setTab === "Conta") panel = `
      <div class="info-block"><h4>👤 Conta</h4>
        <div class="field"><label>Nome</label><input class="input" value="${esc(st.user.name)}" data-setuser="name"/></div>
        <div class="field"><label>Email</label><input class="input" value="${esc(st.user.email)}" disabled/></div>
        <div class="field"><label>Papel</label><input class="input" value="${esc(st.user.role)}" disabled/></div>
      </div>
      <button class="btn btn-danger" data-act="reset-data">Restaurar dados de exemplo</button>`;
    else if (setTab === "Equipe") panel = `
      <div class="info-block"><h4>👥 Equipe & permissões</h4>
        <div class="status-row"><span class="avatar">MA</span><div style="flex:1"><b style="color:var(--text-0)">${esc(st.user.name)}</b><div class="muted" style="font-size:12px">${esc(st.user.email)}</div></div><span class="pill pill-accent">Owner</span></div>
        <div class="status-row"><span class="avatar">AN</span><div style="flex:1"><b style="color:var(--text-0)">Ana</b><div class="muted" style="font-size:12px">ana@casaleve.com</div></div><span class="pill pill-blue">Editor</span></div>
        <button class="btn btn-sm mt-16" data-sim="Convidar membro">+ Convidar membro</button></div>`;
    else if (setTab === "Créditos de IA") panel = creditsPanel();
    else if (setTab === "Integrações") panel = integrationsPanel();
    else if (setTab === "Status personalizados") panel = statusPanel();
    else if (setTab === "Notificações") panel = `
      <div class="info-block"><h4>🔔 Notificações</h4>
        ${["Card pronto para gravar", "Conteúdo com baixa performance", "Créditos acabando", "Campanha sem publicação", "Aprovação pendente"].map((n) => `<div class="status-row"><div style="flex:1">${esc(n)}</div><label style="cursor:pointer"><input type="checkbox" checked style="accent-color:var(--accent);width:16px;height:16px"></label></div>`).join("")}</div>`;
    return `
      <div class="section-title"><span class="st-ico">⚙️</span><h2>Configurações</h2></div>
      <div class="grid" style="grid-template-columns:220px 1fr;align-items:start">
        <div class="panel panel-pad"><div class="set-nav">${nav}</div></div>
        <div>${panel}</div>
      </div>`;
  }

  function creditsPanel() {
    const cr = S.get().credits;
    const pct = Math.round((cr.available / cr.total) * 100);
    const hist = cr.history.map((h) => `<div class="status-row"><div style="flex:1">${esc(h.desc)}</div><span class="muted">${esc(h.date)}</span><b style="color:${h.amount > 0 ? "var(--accent-2)" : "var(--red)"};margin-left:12px">${h.amount > 0 ? "+" : ""}${h.amount}</b></div>`).join("");
    return `
      <div class="info-block"><h4>✨ Créditos de IA</h4>
        <div class="grid grid-3" style="margin-bottom:14px">
          <div class="metric-tile"><div class="mt-lbl">Disponíveis</div><div class="mt-val text-accent">${cr.available}</div></div>
          <div class="metric-tile"><div class="mt-lbl">Usados</div><div class="mt-val">${cr.used}</div></div>
          <div class="metric-tile"><div class="mt-lbl">Total</div><div class="mt-val">${cr.total}</div></div>
        </div>
        <div class="bar" style="margin-bottom:6px"><span style="width:${pct}%"></span></div>
        <div class="muted" style="font-size:12px;margin-bottom:14px">${pct}% dos créditos disponíveis. Cada geração de vídeo IA consome entre 8 e 30 créditos.</div>
        <button class="btn btn-primary" data-act="buy-credits">+ Comprar créditos</button>
      </div>
      <div class="info-block"><h4>📜 Histórico de consumo</h4>${hist}</div>`;
  }

  function integrationsPanel() {
    const groups = [
      { name: "Meta", items: ["Instagram", "Facebook", "Reels", "Ads"], ico: "📱" },
      { name: "Google", items: ["YouTube", "Shorts", "Google Ads", "Google Trends"], ico: "🔍" },
      { name: "Vídeo IA", items: ["Vídeo rápido", "Vídeo premium", "Vídeo para anúncio", "Vídeo para afiliado"], ico: "✨" },
    ];
    return groups.map((g) => `
      <div class="info-block"><h4>${g.ico} ${esc(g.name)}</h4>
        ${g.items.map((i) => `<div class="status-row"><div style="flex:1">${esc(i)}</div><span class="pill pill-gray">Não conectado</span><button class="btn btn-xs" data-sim="Integração ${esc(i)}" style="margin-left:10px">Conectar</button></div>`).join("")}
      </div>`).join("") + `<p class="muted" style="font-size:12px">Você escolhe o objetivo (rápido, premium, anúncio, afiliado) e o sistema decide o provedor por trás.</p>`;
  }

  function statusPanel() {
    const st = S.get();
    const rows = st.statuses.map((s) => `<div class="status-row"><span class="status-color" style="background:${s.color}"></span><div style="flex:1"><b style="color:var(--text-0)">${esc(s.name)}</b></div><div class="x-btn" data-delstatus="${esc(s.name)}">🗑️</div></div>`).join("");
    return `
      <div class="info-block"><h4>🏷️ Status personalizados do Board</h4>
        ${rows}
        <div class="flex gap-8 mt-16"><input class="input" id="new-status-name" placeholder="Nome do novo status" style="flex:1"/><input type="color" id="new-status-color" value="#10b981" style="width:44px;height:40px;border-radius:8px;border:1px solid var(--border-2);background:var(--bg-2)"/><button class="btn btn-primary" data-act="add-status">Adicionar</button></div>
      </div>`;
  }

  function bindConfig(root) {
    root.querySelectorAll("[data-settab]").forEach((el) => el.onclick = () => { setTab = el.dataset.settab; window.App.render(); });
    root.querySelectorAll("[data-sim]").forEach((el) => el.onclick = () => U.simulated(el.dataset.sim, "Integração preparada para conexão real."));
    root.querySelectorAll("[data-act='buy-credits']").forEach((el) => el.onclick = () => window.App.buyCredits());
    root.querySelectorAll("[data-act='reset-data']").forEach((el) => el.onclick = () => U.confirm("Isso vai apagar suas alterações e restaurar os dados de exemplo. Continuar?", () => { S.reset(); U.toast("Dados restaurados"); location.hash = "#/hoje"; window.App.render(); }, { danger: true, yes: "Restaurar" }));
    const setUser = root.querySelector("[data-setuser]"); if (setUser) setUser.onchange = () => S.update((s) => s.user.name = setUser.value);
    root.querySelectorAll("[data-delstatus]").forEach((el) => el.onclick = () => { S.actions.deleteStatus(el.dataset.delstatus); U.toast("Status removido"); });
    const addStatus = root.querySelector("[data-act='add-status']");
    if (addStatus) addStatus.onclick = () => { const n = root.querySelector("#new-status-name").value.trim(); const c = root.querySelector("#new-status-color").value; if (!n) return U.toast("Digite um nome", "warn"); S.actions.addStatus(n, c); U.toast("Status adicionado"); };
  }

  // ============================================================
  // Helpers
  // ============================================================
  function emptyState(ico, title, sub) { return `<div class="empty"><div class="e-ico">${ico}</div><h3>${esc(title)}</h3><p>${esc(sub)}</p></div>`; }
  function statusColor(s) { const f = (S.get().statuses.find((x) => x.name === s)); return f ? f.color : "#8fa39c"; }
  function weekday(d) { if (!d) return -1; const dt = new Date(d + "T00:00:00"); return (dt.getDay() + 6) % 7; } // Mon=0
  function libIco(type) { return { "Gancho vencedor": "🪝", "Roteiro vencedor": "📝", "Criativo vencedor": "🎬", "CTA": "📣", "Promessa": "🎯", "Objeção": "🛡️", "Aprendizado": "🧠", "Template": "🧩" }[type] || "📚"; }

  return {
    hoje, bindHoje, ideias, bindIdeias, campanhas, bindCampanhas, campanha, bindCampanha,
    board, bindBoard, analise, bindAnalise, biblioteca, bindBiblioteca, persona, bindPersona, config, bindConfig,
    emptyState, statusColor,
  };
})();

</script>
  <script>
/* ============================================================
   VIRALIZA — Gravar agora (câmera + teleprompter)
   O roteiro aparece na tela como sobreposição (teleprompter) e
   NÃO é gravado no vídeo — o MediaRecorder captura apenas o
   stream da câmera, não o DOM. Fallback simulado no file://.
   ============================================================ */
window.Recorder = (function () {
  const S = window.Store, U = window.UI, esc = U.esc;

  let cardId = null;
  let stream = null;         // MediaStream da câmera
  let mediaRecorder = null;
  let chunks = [];
  let recordedBlob = null;
  let recordedUrl = null;
  let simulated = false;     // sem câmera real
  let landscape = false;
  let mirror = true;

  // teleprompter
  let tpRAF = null, tpPos = 0, tpLast = 0, tpPlaying = false;
  let tpSpeed = 60;          // px/s
  let tpFont = 26;           // px
  let countdownOn = true;

  // timer
  let recStart = 0, recTimerId = null, recSeconds = 0, recording = false, paused = false;
  let segment = "full";      // full | hook | cta

  function open(id) {
    cardId = id;
    resetMedia();
    renderPrep();
  }

  function card() { return S.sel.card(cardId); }

  // ---------- Roteiro → linhas do teleprompter ----------
  function scriptLines() {
    const s = card().script || {};
    const lines = [];
    if (segment === "hook") {
      if (s.hook) lines.push({ label: "Gancho", text: s.hook, hook: true });
      if (s.hookAlt1) lines.push({ label: "Gancho alt.", text: s.hookAlt1 });
    } else if (segment === "cta") {
      if (s.cta) lines.push({ label: "CTA", text: s.cta });
    } else {
      if (s.hook) lines.push({ label: "Gancho", text: s.hook, hook: true });
      if (s.opening) lines.push({ label: "Abertura (3s)", text: s.opening });
      if (s.mainLine) lines.push({ label: "Fala principal", text: s.mainLine });
      (s.cutPhrases || []).forEach((p) => lines.push({ label: "Frase de corte", text: p }));
      if (s.cta) lines.push({ label: "CTA", text: s.cta });
    }
    if (!lines.length) lines.push({ label: "Roteiro", text: "Sem roteiro definido — grave livremente ou volte ao card e crie o roteiro." });
    return lines;
  }

  // ============================================================
  // 1) Preparação (checklist rápido)
  // ============================================================
  function renderPrep() {
    const items = ["Cenário escolhido e organizado", "Luz testada (rosto iluminado)", "Áudio testado (sem eco/ruído)", "Produto em cena e limpo", "Roteiro revisado"];
    shell(`Gravar agora — ${esc(card().title)}`, `
      <div class="rec-prep">
        <p class="muted" style="text-align:center;margin-bottom:16px">Checklist rápido antes de gravar. Marque o que já está pronto:</p>
        ${items.map((t, i) => `<div class="prep-item" data-prep="${i}"><div class="chk-box" data-box="${i}"></div><div>${esc(t)}</div></div>`).join("")}
        <div class="alert info" style="margin-top:14px"><span class="al-ico">🎬</span><div class="al-body" style="font-size:12px">O roteiro vai aparecer na tela como <b>teleprompter</b> para você ler — mas <b>não aparece no vídeo final</b>.</div></div>
      </div>`,
      `<button class="btn btn-ghost" data-rec-close>Cancelar</button>
       <button class="btn btn-primary" id="rec-start-prep">Iniciar gravação →</button>`);
    const o = document.getElementById("rec-overlay");
    o.querySelectorAll("[data-prep]").forEach((el) => el.onclick = () => { const b = el.querySelector(".chk-box"); b.classList.toggle("done"); b.textContent = b.classList.contains("done") ? "✓" : ""; });
    o.querySelector("#rec-start-prep").onclick = () => renderStage();
  }

  // ============================================================
  // 2) Palco: câmera + teleprompter + controles
  // ============================================================
  async function renderStage() {
    segment = segment || "full";
    shell(`Gravar${segment === "hook" ? " gancho" : segment === "cta" ? " CTA" : ""} — ${esc(card().title)}`, `
      <div class="rec-stage ${landscape ? "landscape" : ""}" id="rec-stage">
        <video id="rec-video" autoplay muted playsinline class="${mirror ? "mirror" : ""}"></video>
        <div class="rec-sim" id="rec-sim" style="display:none">
          <div><div class="rec-sim-ico">📷</div><b style="color:var(--text-1)">Câmera não disponível</b>
          <div style="font-size:12px;max-width:260px;margin-top:6px">Abrindo via arquivo local a câmera pode ser bloqueada. Modo simulado ativo — você ainda pode testar todo o fluxo (gravar, salvar take, analisar).</div></div>
        </div>
        <div class="rec-hud">
          <span class="rec-timer" id="rec-timer"><span class="rec-dot" style="display:none" id="rec-recdot"></span>00:00</span>
          <span class="rec-badge">⏱️ ideal 15–25s</span>
          <span class="rec-badge" id="rec-mode"></span>
        </div>
        <div class="teleprompter" id="rec-tp"><div class="teleprompter-inner" id="rec-tp-inner"></div></div>
        <div class="rec-count" id="rec-count" style="display:none"><span id="rec-count-n">3</span></div>
      </div>

      <div class="rec-controls">
        <button class="rec-btn" id="rec-restart" title="Reiniciar teleprompter">↺</button>
        <button class="rec-btn rmain" id="rec-main" title="Gravar / Parar">⏺</button>
        <button class="rec-btn" id="rec-pause" title="Pausar/continuar teleprompter">⏯</button>
      </div>

      <div class="rec-sliders">
        <div class="rec-slider"><label>Velocidade do texto <span id="rec-speed-v">${tpSpeed} px/s</span></label><input type="range" id="rec-speed" min="20" max="140" value="${tpSpeed}"></div>
        <div class="rec-slider"><label>Tamanho da fonte <span id="rec-font-v">${tpFont} px</span></label><input type="range" id="rec-font" min="16" max="46" value="${tpFont}"></div>
      </div>
      <div class="rec-toggles">
        <span class="chip ${countdownOn ? "on" : ""}" id="rec-cd">⏲ Contagem 3‑2‑1</span>
        <span class="chip ${mirror ? "on" : ""}" id="rec-mirror">🪞 Espelhar</span>
        <span class="chip ${landscape ? "on" : ""}" id="rec-orient">↔️ Horizontal</span>
      </div>
      <div class="rec-note">O teleprompter é sobreposto e <b>não</b> é gravado no vídeo.</div>`,
      `<button class="btn btn-ghost" data-rec-close>Fechar</button>
       <button class="btn btn-sm" id="rec-back-prep">← Checklist</button>`);

    const o = document.getElementById("rec-overlay");
    buildTeleprompter();
    o.querySelector("#rec-back-prep").onclick = () => { stopTeleprompter(); renderPrep(); };
    o.querySelector("#rec-restart").onclick = () => { tpPos = teleStart(); applyTP(); };
    o.querySelector("#rec-pause").onclick = () => { tpPlaying ? stopTeleprompter() : startTeleprompter(); };
    o.querySelector("#rec-main").onclick = () => recording ? stopRecording() : beginCountdownThenRecord();
    const sp = o.querySelector("#rec-speed"); sp.oninput = () => { tpSpeed = +sp.value; o.querySelector("#rec-speed-v").textContent = tpSpeed + " px/s"; };
    const ft = o.querySelector("#rec-font"); ft.oninput = () => { tpFont = +ft.value; o.querySelector("#rec-font-v").textContent = tpFont + " px"; buildTeleprompter(true); };
    o.querySelector("#rec-cd").onclick = (e) => { countdownOn = !countdownOn; e.target.classList.toggle("on", countdownOn); };
    o.querySelector("#rec-mirror").onclick = (e) => { mirror = !mirror; e.target.classList.toggle("on", mirror); const v = document.getElementById("rec-video"); if (v) v.classList.toggle("mirror", mirror); };
    o.querySelector("#rec-orient").onclick = (e) => { landscape = !landscape; e.target.classList.toggle("on", landscape); document.getElementById("rec-stage").classList.toggle("landscape", landscape); };

    await startCamera();
  }

  function buildTeleprompter(keepPos) {
    const inner = document.getElementById("rec-tp-inner");
    if (!inner) return;
    inner.style.fontSize = tpFont + "px";
    inner.innerHTML = scriptLines().map((l) => `<div class="tp-line ${l.hook ? "tp-hook" : ""}"><span class="tp-label">${esc(l.label)}</span>${esc(l.text)}</div>`).join("");
    if (!keepPos) { tpPos = teleStart(); }
    applyTP();
  }
  function teleStart() { const tp = document.getElementById("rec-tp"); return tp ? tp.clientHeight * 0.9 : 200; }
  function applyTP() { const inner = document.getElementById("rec-tp-inner"); if (inner) inner.style.transform = `translateY(${tpPos}px)`; }

  function startTeleprompter() {
    if (tpPlaying) return;
    tpPlaying = true; tpLast = 0;
    const step = (ts) => {
      if (!tpPlaying) return;
      if (!tpLast) tpLast = ts;
      const dt = (ts - tpLast) / 1000; tpLast = ts;
      tpPos -= tpSpeed * dt;
      const inner = document.getElementById("rec-tp-inner");
      if (inner && tpPos < -(inner.scrollHeight)) tpPos = teleStart(); // loop
      applyTP();
      tpRAF = requestAnimationFrame(step);
    };
    tpRAF = requestAnimationFrame(step);
  }
  function stopTeleprompter() { tpPlaying = false; if (tpRAF) cancelAnimationFrame(tpRAF); tpRAF = null; }

  // ---------- Câmera ----------
  async function startCamera() {
    const video = document.getElementById("rec-video");
    const sim = document.getElementById("rec-sim");
    const modeBadge = document.getElementById("rec-mode");
    simulated = false;
    try {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error("no mediaDevices");
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: { ideal: 1080 }, height: { ideal: 1920 } }, audio: true });
      video.srcObject = stream;
      if (modeBadge) modeBadge.textContent = "🟢 Câmera ativa";
    } catch (e) {
      simulated = true;
      if (video) video.style.display = "none";
      if (sim) sim.style.display = "grid";
      if (modeBadge) modeBadge.textContent = "⚪ Modo simulado";
    }
  }

  function resetMedia() {
    recordedBlob = null; if (recordedUrl) { URL.revokeObjectURL(recordedUrl); recordedUrl = null; }
    chunks = []; recording = false; paused = false; recSeconds = 0; segment = "full";
  }
  function stopCamera() { if (stream) { stream.getTracks().forEach((t) => t.stop()); stream = null; } }

  // ---------- Contagem + gravação ----------
  function beginCountdownThenRecord() {
    if (!countdownOn) return startRecording();
    const el = document.getElementById("rec-count"), n = document.getElementById("rec-count-n");
    let c = 3; el.style.display = "grid"; n.textContent = c;
    const iv = setInterval(() => {
      c--;
      if (c <= 0) { clearInterval(iv); el.style.display = "none"; startRecording(); }
      else n.textContent = c;
    }, 800);
  }

  function startRecording() {
    recording = true; paused = false; recSeconds = 0;
    document.getElementById("rec-main").classList.add("recording");
    document.getElementById("rec-recdot").style.display = "inline-block";
    startTeleprompter();
    // timer
    updateTimer();
    recTimerId = setInterval(() => { if (!paused) { recSeconds++; updateTimer(); } }, 1000);
    // MediaRecorder (real)
    if (!simulated && stream) {
      chunks = [];
      let opts = {};
      const types = ["video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm", "video/mp4"];
      for (const t of types) { if (window.MediaRecorder && MediaRecorder.isTypeSupported(t)) { opts = { mimeType: t }; break; } }
      try {
        mediaRecorder = new MediaRecorder(stream, opts);
        mediaRecorder.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
        mediaRecorder.onstop = () => { recordedBlob = new Blob(chunks, { type: (mediaRecorder.mimeType || "video/webm") }); recordedUrl = URL.createObjectURL(recordedBlob); renderReview(); };
        mediaRecorder.start();
      } catch (e) { simulated = true; }
    }
    U.toast("Gravando…");
  }

  function stopRecording() {
    recording = false;
    document.getElementById("rec-main") && document.getElementById("rec-main").classList.remove("recording");
    const dot = document.getElementById("rec-recdot"); if (dot) dot.style.display = "none";
    stopTeleprompter();
    if (recTimerId) { clearInterval(recTimerId); recTimerId = null; }
    if (!simulated && mediaRecorder && mediaRecorder.state !== "inactive") {
      mediaRecorder.stop(); // triggers onstop → renderReview
    } else {
      renderReview(); // simulated
    }
  }

  function updateTimer() { const el = document.getElementById("rec-timer"); if (el) el.innerHTML = `<span class="rec-dot" id="rec-recdot" style="display:${recording ? "inline-block" : "none"}"></span>${mmss(recSeconds)}`; }
  function mmss(s) { const m = Math.floor(s / 60), r = s % 60; return String(m).padStart(2, "0") + ":" + String(r).padStart(2, "0"); }

  // ============================================================
  // 3) Revisão + ações pós-gravação
  // ============================================================
  let aiDone = false;
  function renderReview() {
    stopCamera(); aiDone = false;
    const dur = mmss(recSeconds);
    const preview = recordedUrl
      ? `<video src="${recordedUrl}" controls playsinline class="${mirror ? "" : ""}" style="width:100%;height:100%;object-fit:cover"></video>`
      : `<div class="rec-sim"><div><div class="rec-sim-ico">🎬</div><b style="color:var(--text-1)">Take gravado (simulado)</b><div style="font-size:12px;margin-top:6px">Duração ${dur}. Sem câmera real, o vídeo não é baixável — mas o fluxo de salvar e analisar funciona.</div></div></div>`;
    shell(`Take gravado — ${esc(card().title)}`, `
      <div class="rec-stage ${landscape ? "landscape" : ""}" style="max-height:52vh">${preview}
        <div class="rec-hud"><span class="rec-badge">⏱️ ${dur}</span><span class="rec-badge">${simulated ? "⚪ simulado" : "🟢 vídeo real"}</span></div>
      </div>
      <div class="rec-controls" style="margin-top:14px">
        <button class="btn" id="rev-repeat">↺ Repetir take</button>
        <button class="btn btn-primary" id="rev-save">💾 Salvar take no card</button>
        <button class="btn" id="rev-download" ${recordedUrl ? "" : "disabled"}>⬇️ Baixar vídeo</button>
        <button class="btn" id="rev-analyze">🔍 Enviar para análise</button>
      </div>
      <div id="rev-ai"></div>
      <div class="divider"></div>
      <p class="muted" style="font-size:12px;text-align:center;margin-bottom:8px">Depois de gravar — corrija e multiplique:</p>
      <div class="rec-after">
        <button class="btn btn-sm" id="rev-caption">✍️ Gerar legenda</button>
        <button class="btn btn-sm" id="rev-rehook">🪝 Regravar gancho</button>
        <button class="btn btn-sm" id="rev-recta">📣 Regravar CTA</button>
        <button class="btn btn-sm" id="rev-variation">🧬 Criar variação</button>
      </div>`,
      `<button class="btn btn-ghost" data-rec-close>Concluir</button>`);

    const o = document.getElementById("rec-overlay");
    o.querySelector("#rev-repeat").onclick = () => { resetTakeKeepSegment(); renderStage(); };
    o.querySelector("#rev-save").onclick = () => saveTake();
    o.querySelector("#rev-download").onclick = () => downloadTake();
    o.querySelector("#rev-analyze").onclick = () => analyzeTake();
    o.querySelector("#rev-caption").onclick = () => genCaption();
    o.querySelector("#rev-rehook").onclick = () => { segment = "hook"; resetTakeKeepSegment(); renderStage(); };
    o.querySelector("#rev-recta").onclick = () => { segment = "cta"; resetTakeKeepSegment(); renderStage(); };
    o.querySelector("#rev-variation").onclick = () => createVariation();
  }

  function resetTakeKeepSegment() { chunks = []; recSeconds = 0; recording = false; if (recordedUrl) { URL.revokeObjectURL(recordedUrl); recordedUrl = null; } recordedBlob = null; }

  let savedThisTake = false;
  function saveTake() {
    const fn = `take-${cardId.slice(-4)}-${mmss(recSeconds).replace(":", "m")}s.webm`;
    S.actions.addCreative(cardId, { type: segment === "hook" ? "Regravação do gancho" : segment === "cta" ? "Regravação do CTA" : "Vídeo gravado", source: "Gravação no app (teleprompter)", status: "Gravado", fileName: fn, creditsUsed: 0 });
    S.actions.addFile(cardId, { name: fn, type: "Vídeo bruto", size: simulated ? "—" : approxSize(), ico: "🎬" });
    S.actions.setCardStatus(cardId, "Gravado");
    savedThisTake = true;
    U.toast("Take salvo no card ✓");
  }
  function approxSize() { return recordedBlob ? (recordedBlob.size / (1024 * 1024)).toFixed(1) + " MB" : "—"; }

  function downloadTake() {
    if (!recordedUrl) return U.toast("Sem vídeo real para baixar (modo simulado)", "warn");
    const a = document.createElement("a");
    a.href = recordedUrl; a.download = `take-${card().title.replace(/[^\w]+/g, "-").toLowerCase()}.webm`;
    document.body.appendChild(a); a.click(); a.remove();
    U.toast("Download iniciado ✓");
  }

  function analyzeTake() {
    if (!savedThisTake) saveTake();
    S.actions.setCardStatus(cardId, "Enviado para análise");
    // marca criativo como analisado
    S.update((s) => { const c = s.cards.find((x) => x.id === cardId); if (c.content.creatives[0]) c.content.creatives[0].status = "Analisado"; });
    aiDone = true;
    const box = document.getElementById("rev-ai");
    if (box) box.innerHTML = `
      <div class="info-block" style="margin-top:14px"><h4>🤖 Análise da IA</h4>
        <div class="score-ring" style="margin-bottom:12px">
          <div class="ring" style="background:conic-gradient(var(--accent) 0% 76%, var(--bg-3) 76% 100%)"><div style="width:72px;height:72px;border-radius:50%;background:var(--panel);display:grid;place-items:center"><div class="ring-val">7.6</div></div></div>
          <div><b style="color:var(--text-0)">Boa base — ${recSeconds < 8 ? "muito curto" : recSeconds > 45 ? "um pouco longo" : "duração ideal"}</b><p class="muted" style="font-size:13px;margin-top:4px">Gancho no tempo certo. Ajuste o CTA e mostre o produto cedo para subir a conversão.</p></div>
        </div>
        <div class="analysis-row"><span class="ar-ico">✅</span><div><b style="color:var(--text-0)">Ponto forte:</b> leitura fluida com o teleprompter, ritmo bom.</div></div>
        <div class="analysis-row"><span class="ar-ico">⚠️</span><div><b style="color:var(--text-0)">Melhorar:</b> reforçar o CTA no fim e mostrar o produto nos primeiros segundos.</div></div>
        <div class="analysis-row"><span class="ar-ico">✨</span><div><b style="color:var(--text-0)">Sugestão:</b> regravar só o gancho e testar uma variação.</div></div>
      </div>`;
    U.toast("Vídeo analisado pela IA ✓");
  }

  function genCaption() {
    const s = card().script || {};
    const cap = s.caption || `${s.hook || "Olha isso 👇"} \n\n${s.cta || "Link na bio!"} ${s.hashtags || "#viraliza"}`;
    S.actions.patchCard(cardId, "publication.captionFinal", cap);
    U.toast("Legenda gerada e salva na Publicação ✓");
  }

  function createVariation() {
    const c = card();
    S.actions.addCard({ title: c.title + " — Variação", type: c.type, campaignId: c.campaignId, channel: c.channel, status: "Ideia", priority: c.priority, methods: c.methods, strategy: Object.assign({}, c.strategy), nextAction: "Testar variação" });
    U.toast("Variação criada no Board ✓");
  }

  // ============================================================
  // Shell (overlay)
  // ============================================================
  function shell(title, body, foot) {
    close(true);
    const o = document.createElement("div");
    o.className = "rec-overlay"; o.id = "rec-overlay";
    o.innerHTML = `<div class="rec-shell">
      <div class="rec-head"><h3>${title}</h3><div class="x-btn" data-rec-close>✕</div></div>
      <div class="rec-body">${body}</div>
      ${foot ? `<div class="rec-foot">${foot}</div>` : ""}
    </div>`;
    document.body.appendChild(o);
    o.querySelectorAll("[data-rec-close]").forEach((el) => el.onclick = () => close());
    return o;
  }

  function close(silent) {
    stopTeleprompter();
    if (recTimerId) { clearInterval(recTimerId); recTimerId = null; }
    if (!silent) stopCamera();
    const o = document.getElementById("rec-overlay");
    if (o) o.remove();
    if (!silent) {
      recording = false; savedThisTake = false;
      // refresh underlying card drawer if open
      if (window.CardView && document.getElementById("modal-overlay")) window.App.openCard(cardId);
      else window.App.render();
    }
  }

  return { open, close };
})();

</script>
  <script>
/* ============================================================
   R.E.A.L. OS — Card detalhado (drawer com 9 abas)
   Resumo · Estratégia · Roteiro · Conteúdo · Checklist ·
   Publicação · Análise · Correção · Arquivos
   ============================================================ */
window.CardView = (function () {
  const S = window.Store, U = window.UI, esc = U.esc, fmt = U.fmt, pill = U.statusPill;
  let cardId = null, tab = "Resumo";

  const TABS = ["Resumo", "Estratégia", "Roteiro", "Conteúdo", "Checklist", "Publicação", "Análise", "Correção", "Arquivos"];
  const METHODS = ["Promessa Forte", "Gancho de Retenção", "Dor e Solução", "Antes e Depois", "Prova Social", "Review", "Demonstração", "Comparação", "Unboxing", "Oferta Clara", "Urgência", "Bastidor de Autoridade", "Resposta a Comentário", "Quebra de Objeção", "Conteúdo de Rua", "Produto no Dia a Dia", "Transformação", "Comunidade e Desejo", "Frases de Corte", "Volume e Distribuição", "Teste de Variações"];
  const METHOD_ICO = { "Promessa Forte": "🎯", "Gancho de Retenção": "🪝", "Dor e Solução": "💢", "Antes e Depois": "🔄", "Prova Social": "👥", "Review": "⭐", "Demonstração": "🧪", "Comparação": "⚖️", "Unboxing": "📦", "Oferta Clara": "🏷️", "Urgência": "⏰", "Bastidor de Autoridade": "🎬", "Resposta a Comentário": "💬", "Quebra de Objeção": "🛡️", "Conteúdo de Rua": "🏙️", "Produto no Dia a Dia": "🏠", "Transformação": "✨", "Comunidade e Desejo": "❤️", "Frases de Corte": "✂️", "Volume e Distribuição": "📡", "Teste de Variações": "🧬" };

  const VIDEO_TYPES = ["Produto em destaque", "Antes e depois", "Ambiente decorado", "Oferta rápida", "Vídeo de afiliado", "Review", "Anúncio", "Story", "Marketplace", "Live Shop", "Prova social", "Transformação"];
  const TEMPLATES = ["Zoom lento no produto", "Produto entrando em cena", "Ambiente antes e depois", "Destaque de benefício", "Oferta com CTA", "Comparação", "Demonstração visual", "Vídeo UGC simulado", "Produto em uso", "Chamada para live"];
  const CORRECTION_REASONS = ["Gancho fraco", "Produto apareceu tarde", "CTA fraco", "Vídeo longo", "Áudio ruim", "Imagem ruim", "Promessa confusa", "Faltou prova", "Faltou oferta", "Pouca emoção", "Público errado", "Canal errado", "Legenda fraca", "Baixa conversão", "Baixa retenção"];

  function open(id) { cardId = id; tab = "Resumo"; render(); }
  function card() { return S.sel.card(cardId); }

  function render() {
    const c = card();
    if (!c) return U.closeModal();
    const chkDone = c.checklist.flatMap((g) => g.items).filter((i) => i.done).length;
    const chkTotal = c.checklist.flatMap((g) => g.items).length;
    const counts = { "Correção": c.corrections.length, "Arquivos": c.files.length, "Checklist": `${chkDone}/${chkTotal}` };
    const tabsHTML = TABS.map((t) => `<div class="drawer-tab ${t === tab ? "active" : ""}" data-tab="${t}">${t}${counts[t] != null ? `<span class="dt-count">${counts[t]}</span>` : ""}</div>`).join("");

    const body = `
      <div style="margin:-22px -22px 0">
        <div class="drawer-tabs">${tabsHTML}</div>
        <div style="padding:22px" id="card-tab-body">${renderTab(c)}</div>
      </div>`;

    const camp = S.sel.campaign(c.campaignId);
    U.modal({
      title: c.title, size: "wide", body,
      foot: `<div style="margin-right:auto;display:flex;gap:8px;align-items:center" class="wrap">${pill(c.status)} <span class="muted">${camp ? esc(camp.title) : ""}</span></div>
        <button class="btn btn-ghost btn-sm" data-cardact="delete">Excluir</button>
        <button class="btn btn-primary btn-sm" data-cardact="ai">✦ Assistente do card</button>`,
      onMount: bind,
    });
  }

  function bind(root) {
    root.querySelectorAll("[data-tab]").forEach((el) => el.onclick = () => { tab = el.dataset.tab; refreshBody(); root.querySelectorAll("[data-tab]").forEach((x) => x.classList.toggle("active", x.dataset.tab === tab)); });
    root.querySelector("[data-cardact='ai']").onclick = () => U.openChat("Card: " + card().title, "Estou no contexto deste card. Posso melhorar o gancho, gerar roteiro, criar checklist, analisar o vídeo ou criar uma correção. O que você quer?", ["Melhorar gancho", "Criar variação", "Gerar nova legenda", "Criar card de regravação", "Salvar na biblioteca"]);
    root.querySelector("[data-cardact='delete']").onclick = () => U.confirm("Excluir este card?", () => { S.actions.deleteCard(cardId); U.closeModal(); U.toast("Card excluído"); window.App.render(); }, { danger: true, yes: "Excluir" });
    bindTab(root);
  }

  function refreshBody() {
    const el = document.getElementById("card-tab-body");
    if (el) { el.innerHTML = renderTab(card()); bindTab(document.getElementById("modal-overlay")); }
  }

  // ------------------------------------------------------------
  function renderTab(c) {
    switch (tab) {
      case "Resumo": return tResumo(c);
      case "Estratégia": return tEstrategia(c);
      case "Roteiro": return tRoteiro(c);
      case "Conteúdo": return tConteudo(c);
      case "Checklist": return tChecklist(c);
      case "Publicação": return tPublicacao(c);
      case "Análise": return tAnalise(c);
      case "Correção": return tCorrecao(c);
      case "Arquivos": return tArquivos(c);
    }
  }

  // ---------- RESUMO ----------
  function tResumo(c) {
    const camp = S.sel.campaign(c.campaignId);
    const actions = [
      ["iniciar", "▶️ Iniciar execução"], ["send-video", "📤 Enviar vídeo"], ["record", "🎥 Gravar agora"],
      ["gen-ai", "✨ Gerar criativo IA"], ["analyze", "🔍 Analisar conteúdo"], ["variation", "🧬 Criar variação"],
      ["published", "✅ Marcar como publicado"], ["correction", "🛠️ Criar correção"],
    ];
    return `
      <div class="grid" style="grid-template-columns:1.3fr 1fr;align-items:start">
        <div>
          <div class="info-block"><h4>🃏 Resumo</h4>
            <div class="kv">
              <div class="k">Título</div><div class="v"><input class="input" data-f="title" value="${esc(c.title)}"/></div>
              <div class="k">Campanha</div><div class="v">${camp ? esc(camp.title) : "—"}</div>
              <div class="k">Produto</div><div class="v">${esc(camp ? camp.productName : "—")}</div>
              <div class="k">Tipo</div><div class="v">${esc(c.type)}</div>
              <div class="k">Objetivo</div><div class="v"><input class="input" data-f="objective" value="${esc(c.objective)}"/></div>
              <div class="k">Canal</div><div class="v">${selChannel(c.channel, "channel")}</div>
              <div class="k">Status</div><div class="v">${selStatus(c.status)}</div>
              <div class="k">Prioridade</div><div class="v">${selPrio(c.priority)}</div>
              <div class="k">Responsável</div><div class="v"><input class="input" data-f="responsible" value="${esc(c.responsible)}"/></div>
              <div class="k">Data / hora</div><div class="v"><div class="flex gap-8"><input class="input" type="date" data-f="date" value="${esc(c.date)}"/><input class="input" type="time" data-f="time" value="${esc(c.time)}" style="max-width:120px"/></div></div>
              <div class="k">Prazo</div><div class="v"><input class="input" type="date" data-f="deadline" value="${esc(c.deadline)}"/></div>
              <div class="k">Próxima ação</div><div class="v"><input class="input" data-f="nextAction" value="${esc(c.nextAction)}"/></div>
            </div>
          </div>
        </div>
        <div>
          <div class="info-block"><h4>📊 Progresso</h4>
            <div class="flex-between" style="margin-bottom:8px"><span class="muted">Checklist concluído</span><b class="text-accent">${c.progress}%</b></div>
            <div class="bar"><span style="width:${c.progress}%"></span></div>
          </div>
          <div class="info-block"><h4>⚡ Ações do card</h4>
            <div class="grid" style="grid-template-columns:1fr 1fr;gap:8px">
              ${actions.map(([a, l]) => `<button class="btn btn-sm" data-ca="${a}" style="justify-content:flex-start">${l}</button>`).join("")}
            </div>
          </div>
          <div class="info-block mb-0"><h4>📝 Observações rápidas</h4>
            <textarea class="textarea" data-f="notes" placeholder="Anotações rápidas…">${esc(c.notes || "")}</textarea>
          </div>
        </div>
      </div>`;
  }

  // ---------- ESTRATÉGIA ----------
  function tEstrategia(c) {
    const s = c.strategy || {};
    const realCards = [
      { l: "R", n: "Retenção", c: "var(--r-ret)", q: "Por que a pessoa pararia para assistir?" },
      { l: "E", n: "Emoção", c: "var(--r-emo)", q: "O que a pessoa precisa sentir para agir?" },
      { l: "A", n: "Autoridade", c: "var(--r-aut)", q: "Por que a pessoa deveria confiar nisso?" },
      { l: "L", n: "Loop", c: "var(--r-loop)", q: "Por que a pessoa voltaria para ver o próximo?" },
    ];
    return `
      <div class="info-block"><h4>🧭 Método R.E.A.L.</h4>
        <div class="real-grid">${realCards.map((r) => `<div class="real-card" style="border-top:2px solid ${r.c}"><div class="rc-letter" style="background:${r.c}22;color:${r.c}">${r.l}</div><h5>${r.n}</h5><p>${r.q}</p></div>`).join("")}</div>
      </div>
      <div class="info-block"><h4>🎯 Métodos estratégicos <span class="muted" style="font-weight:400">(clique para aplicar no card)</span></h4>
        <div class="method-grid">
          ${METHODS.map((m) => `<div class="method-btn ${(c.methods || []).includes(m) ? "on" : ""}" data-method="${esc(m)}"><span class="mb-ico">${METHOD_ICO[m] || "•"}</span>${esc(m)}</div>`).join("")}
        </div>
      </div>
      <div class="grid grid-2" style="align-items:start">
        <div class="info-block"><h4>📋 Definição estratégica</h4>
          <div class="field"><label>Objetivo do conteúdo</label><input class="input" data-s="objective" value="${esc(s.objective || "")}"/></div>
          <div class="field"><label>Público</label><input class="input" data-s="audience" value="${esc(s.audience || "")}"/></div>
          <div class="form-row"><div class="field"><label>Dor</label><input class="input" data-s="pain" value="${esc(s.pain || "")}"/></div><div class="field"><label>Desejo</label><input class="input" data-s="desire" value="${esc(s.desire || "")}"/></div></div>
          <div class="field"><label>Promessa</label><input class="input" data-s="promise" value="${esc(s.promise || "")}"/></div>
          <div class="form-row"><div class="field"><label>Emoção principal</label><input class="input" data-s="emotion" value="${esc(s.emotion || "")}"/></div><div class="field"><label>CTA</label><input class="input" data-s="cta" value="${esc(s.cta || "")}"/></div></div>
        </div>
        <div class="info-block"><h4>🛡️ Prova & adaptação</h4>
          <div class="field"><label>Oferta</label><input class="input" data-s="offer" value="${esc(s.offer || "")}"/></div>
          <div class="field"><label>Objeção que será quebrada</label><input class="input" data-s="objection" value="${esc(s.objection || "")}"/></div>
          <div class="field"><label>Prova usada</label><input class="input" data-s="proof" value="${esc(s.proof || "")}"/></div>
          <div class="field"><label>Método R.E.A.L. aplicado</label><textarea class="textarea" data-s="realMethod" style="min-height:70px">${esc(s.realMethod || "")}</textarea></div>
          <div class="form-row"><div class="field mb-0"><label>Canal principal</label><input class="input" data-s="channel" value="${esc(s.channel || "")}"/></div><div class="field mb-0"><label>Adaptação por canal</label><input class="input" data-s="channelAdapt" value="${esc(s.channelAdapt || "")}"/></div></div>
        </div>
      </div>`;
  }

  // ---------- ROTEIRO ----------
  function tRoteiro(c) {
    const s = c.script || {};
    const tools = [["melhorar-gancho", "Melhorar gancho"], ["mais-direto", "Mais direto"], ["mais-popular", "Mais popular"], ["mais-emocional", "Mais emocional"], ["mais-vendedor", "Mais vendedor"], ["versao-curta", "Versão curta"], ["versao-anuncio", "Versão anúncio"], ["versao-stories", "Versão stories"], ["salvar-lib", "Salvar na biblioteca"], ["variacao", "Transformar em variação"]];
    return `
      <div class="flex gap-8 wrap" style="margin-bottom:16px">${tools.map(([a, l]) => `<button class="btn btn-xs" data-rt="${a}">${l}</button>`).join("")}</div>
      <div class="grid grid-2" style="align-items:start">
        <div>
          <div class="script-block"><div class="sb-label">🪝 Gancho principal</div><div class="sb-content" contenteditable="true" data-sc="hook">${esc(s.hook)}</div></div>

  // ---------- CONTEÚDO ----------
  function tConteudo(c) {
    const ct = c.content || { path: null, creatives: [] };
    const creatives = (ct.creatives || []).map((cr) => `
      <div class="file-tile" style="margin-bottom:8px"><div class="ft-ico">${cr.source && cr.source.includes("IA") ? "✨" : "🎬"}</div>
        <div style="flex:1"><div class="ft-name">${esc(cr.fileName || cr.type)}</div><div class="ft-meta">${esc(cr.type)} · ${esc(cr.source)}${cr.creditsUsed ? ` · ${cr.creditsUsed} créditos` : ""}</div></div>
        <span class="pill pill-accent">${esc(cr.status)}</span></div>`).join("");

    if (ct.path === "gerar") return contentGenerate(c, creatives);
    if (ct.path === "enviar") return contentSend(c, creatives);
    if (ct.path === "gravar") return contentRecord(c, creatives);

    return `
      <p class="muted" style="margin-bottom:16px">Escolha como criar o conteúdo deste card. Três caminhos:</p>
      <div class="content-paths">
        <div class="content-path" data-path="gerar"><div class="cp-ico">✨</div><h4>Gerar com IA</h4><p>Crie um vídeo com IA a partir da foto do produto, com template e prévia.</p></div>
        <div class="content-path" data-path="enviar"><div class="cp-ico">📤</div><h4>Enviar vídeo</h4><p>Suba um vídeo gravado por você e receba análise completa da IA.</p></div>
        <div class="content-path" data-path="gravar"><div class="cp-ico">🎥</div><h4>Gravar agora</h4><p>Grave direto pelo sistema com roteiro e gancho na tela.</p></div>
      </div>
      ${creatives ? `<div class="info-block"><h4>🎬 Criativos deste card</h4>${creatives}</div>` : ""}`;
  }

  function contentGenerate(c, creatives) {
    const cr = S.get().credits;
    return `
      <button class="btn btn-ghost btn-sm" data-path="" style="margin-bottom:12px">← Caminhos</button>
      <div class="info-block"><h4>✨ Gerar vídeo com IA</h4>
        <div class="upload-zone" data-sim="Upload da imagem do produto" style="margin-bottom:16px"><div class="uz-ico">🖼️</div><b style="color:var(--text-0)">Upload da imagem do produto</b><div class="muted" style="font-size:12px;margin-top:4px">A IA valida a imagem automaticamente. Formatos: JPG, PNG.</div></div>
        <div class="form-row">
          <div class="field"><label>Tipo de vídeo</label><select class="select" id="gen-type">${VIDEO_TYPES.map((t) => `<option>${esc(t)}</option>`).join("")}</select></div>
          <div class="field"><label>Template</label><select class="select" id="gen-tpl">${TEMPLATES.map((t) => `<option>${esc(t)}</option>`).join("")}</select></div>
        </div>

      </div>

        <div class="kv">
          <div class="k">Duração</div><div class="v">~20s (vertical 9:16)</div>
          <div class="k">Canal</div><div class="v">${esc(c.channel)}</div>
          <div class="k">Cenas</div><div class="v">Produto → benefício → oferta → CTA</div>
          <div class="k">Texto na tela</div><div class="v">${esc((c.script.screenText || []).join(" | ") || "Gerado pela IA")}</div>
          <div class="k">CTA</div><div class="v">${esc(c.script.cta || "Link na bio")}</div>
          <div class="k">Custo estimado</div><div class="v"><b class="text-accent">12 créditos</b> <span class="muted">(você tem ${cr.available})</span></div>

  function contentSend(c, creatives) {
    const analyzed = (c.content.creatives || []).some((x) => x.status === "Analisado");
    return `
      <button class="btn btn-ghost btn-sm" data-path="" style="margin-bottom:12px">← Caminhos</button>

  function tAnalise(c) {
    const a = c.analysis || {};
    const fields = [["views", "Visualizações"], ["reach", "Alcance"], ["retention", "Retenção"], ["likes", "Curtidas"], ["comments", "Comentários"], ["shares", "Compart."], ["saves", "Salvamentos"], ["clicks", "Cliques"], ["leads", "Leads"], ["sales", "Vendas"], ["cost", "Custo"], ["conversion", "Conversão"]];
    const m = a.metrics || {};
    const inputs = fields.map(([k, l]) => `<div class="field mb-0"><label>${l}</label><input class="input" data-m="${k}" value="${esc(m[k] != null ? m[k] : "")}"/></div>`).join("");
    return `
      <div class="grid" style="grid-template-columns:1fr 1.2fr;align-items:start">
        <div class="info-block"><h4>📊 Métricas ${a.done ? "" : "(inserir manualmente)"}</h4>
          <div class="grid" style="grid-template-columns:1fr 1fr;gap:12px">${inputs}</div>
          <button class="btn btn-primary btn-sm mt-16" data-ca="save-metrics">💾 Salvar métricas & analisar</button>
        </div>
        <div>
          ${a.done && a.summary ? `
          <div class="info-block"><h4>🤖 Diagnóstico da IA</h4>
            <div class="analysis-row"><span class="ar-ico">✅</span><div><b style="color:var(--text-0)">Funcionou:</b> ${esc(a.summary.worked)}</div></div>

            <div class="analysis-row"><span class="ar-ico">🧬</span><div><b style="color:var(--text-0)">Variação:</b> ${esc(a.summary.variation)}</div></div>

            <button class="btn btn-sm" data-ca="correction">🛠️ Gerar correção</button>

        <div><b style="color:var(--text-0)">Nota geral: boa base</b><p class="muted" style="font-size:13px;margin-top:4px">Retenção provável média-alta. Ajustar CTA e mostrar produto mais cedo aumenta conversão.</p></div>

      <div class="flex gap-8 wrap mt-16"><button class="btn btn-sm" data-ca="correction">🛠️ Criar card de regravação</button><button class="btn btn-sm" data-ca="new-caption">✍️ Nova legenda</button><button class="btn btn-sm" data-ca="variation">🧬 Variações para teste</button></div>
