  // Central card action handler
  function cardAction(a, el2) {
    const c = card();
    const cr = S.get().credits;
    const a2 = el2 ? el2.dataset.ver : null;
    switch (a) {
      case "iniciar": S.actions.setCardStatus(cardId, "Roteiro"); U.toast("Execução iniciada"); refreshHead(); break;
      case "send-video": S.actions.patchCard(cardId, "content.path", "enviar"); tab = "Conteúdo"; render(); break;
      case "record": S.actions.patchCard(cardId, "content.path", "gravar"); tab = "Conteúdo"; window.Recorder.open(cardId); break;
      case "open-recorder": window.Recorder.open(cardId); break;
      case "upload-gallery": window.VideoStudio.openUpload(cardId); break;
      case "view-original": window.VideoStudio.viewOriginal(cardId); break;
      case "gen-opening": window.VideoStudio.retention(true); break;
      case "view-edited": window.VideoStudio.openEdited(cardId); break;
      case "use-version": if (a2) { window.VideoStudio.chooseVersion(cardId, a2); refreshBody(); refreshHead(); } break;
      case "send-analysis-video":
        S.actions.setCardStatus(cardId, "Enviado para análise");
        S.update((s) => { const cc = s.cards.find((x) => x.id === cardId); if (cc.content.creatives[0]) cc.content.creatives[0].status = "Analisado"; });
        U.toast("Vídeo enviado para análise da IA ✓"); render(); break;
      case "gen-ai": S.actions.patchCard(cardId, "content.path", "gerar"); tab = "Conteúdo"; render(); break;
      // ---- IA: estratégia, roteiro, visual, checklist ----
      case "new-strategy": { const camp = S.sel.campaign(c.campaignId) || {}; S.actions.updateCard(cardId, { strategy: AI.generateStrategyForCard(c, camp) }); U.toast("Nova estratégia gerada pela IA ✓"); refreshBody(); break; }
      case "strategy-to-script": { const camp = S.sel.campaign(c.campaignId) || {}; S.actions.updateCard(cardId, { script: AI.generateScriptForCard(c, camp) }); U.toast("Estratégia aplicada no roteiro ✓"); tab = "Roteiro"; render(); break; }
      case "gen-visual": { const camp = S.sel.campaign(c.campaignId) || {}; S.actions.updateCard(cardId, { visual: AI.generateVisualDirection(c, camp) }); U.toast("Visual do vídeo gerado pela IA ✓"); refreshBody(); break; }
      case "gen-script": maybeResearch(c, (research) => { const camp = S.sel.campaign(c.campaignId) || {}; let ns = AI.generateScriptForCard(c, camp); if (research) ns = applyResearch(ns, research); S.actions.updateCard(cardId, { script: ns }); U.toast("Roteiro completo gerado ✓"); refreshBody(); }); break;
      case "gen-hooks": maybeResearch(c, (research) => { const camp = S.sel.campaign(c.campaignId) || {}; let ns = AI.generateScriptForCard(c, camp); if (research) ns = applyResearch(ns, research); S.actions.patchCard(cardId, "script.hook", ns.hook); S.actions.patchCard(cardId, "script.hookAlt1", ns.hookAlt1); S.actions.patchCard(cardId, "script.hookAlt2", ns.hookAlt2); U.toast("3 ganchos gerados ✓"); refreshBody(); }); break;
      case "research-roteiro": doResearch(c); break;
      case "approve_script": {
        window.Learning.saveApproval({ type: "script", finalContent: c.script.hook, tone: (S.sel.campaign(c.campaignId) || {}).style, cardId, campaignId: c.campaignId });
        window.Learning.saveApproval({ type: "hook", finalContent: c.script.hook, cardId });
        if (c.script.cta) window.Learning.saveApproval({ type: "cta", finalContent: c.script.cta, cardId });
        S.actions.addLibrary({ type: "Roteiro vencedor", title: c.script.title || c.title, content: c.script.hook || "", source: cardId, tags: ["aprovado"] });
        U.toast("Roteiro aprovado ✓ — salvei como padrão da sua operação"); break;
      }
      case "save_pattern_script": window.Learning.saveApproval({ type: "hook", finalContent: c.script.hook, cardId }); U.toast("Gancho salvo como padrão aprovado ✓"); break;
      case "reject_script": {
        const reasons = ["Genérico demais", "Formal demais", "Longo demais", "Fraco para venda", "Não combina com meu público", "Roteiro desconexo", "CTA fraco"];
        U.modal({ title: "Rejeitar roteiro", size: "narrow", body: `<p class="muted" style="margin-bottom:10px">Por quê? Vou evitar esse estilo nas próximas gerações.</p><div class="set-nav">${reasons.map((r) => `<div class="set-nav-item" data-rej="${esc(r)}">${r}</div>`).join("")}</div>`,
          onMount: (o) => o.querySelectorAll("[data-rej]").forEach((el) => el.onclick = () => { window.Learning.saveRejection({ type: "hook", originalContent: c.script.hook, reason: el.dataset.rej, cardId, campaignId: c.campaignId }); U.closeModal(); U.toast("Anotado: evitar “" + el.dataset.rej + "” ✓"); }) });
        break;
      }
      case "gen-stories": { const camp = S.sel.campaign(c.campaignId) || {}; S.actions.patchCard(cardId, "script.stories", AI.generateStoriesForCard(c, camp).join("\n")); U.toast("Stories gerados ✓"); refreshBody(); break; }
      case "gen-audience-var": genAudienceVariation(c); break;
      case "versao-curta": U.simulated("Versão curta", "Versão de 10s criada como variação."); break;
      case "versao-anuncio": U.simulated("Versão anúncio", "Versão para anúncio criada como variação."); break;
      case "salvar-lib": S.actions.addLibrary({ type: "Roteiro vencedor", title: c.script.title || c.title, content: c.script.hook || "", source: cardId, tags: ["roteiro"] }); U.toast("Roteiro salvo na biblioteca ✓"); break;
      // ---- Checklist ----
      case "add-group": U.modal({ title: "Novo grupo", size: "narrow", body: `<div class="field mb-0"><input class="input" id="ng-name" placeholder="Nome do grupo"/></div>`, foot: `<button class="btn btn-ghost" data-close>Cancelar</button><button class="btn btn-primary" id="ng-ok">Adicionar</button>`, onMount: (o) => o.querySelector("#ng-ok").onclick = () => { const n = o.querySelector("#ng-name").value.trim(); if (!n) return; S.actions.chkAddGroup(cardId, n); U.closeModal(); refreshBody(); } }); break;
      case "reset-checklist": { const camp = S.sel.campaign(c.campaignId) || {}; S.actions.setChecklist(cardId, AI.generateChecklistForCard(c, camp)); U.toast("Checklist gerado pela IA ✓"); refreshBody(); break; }
      // ---- Correção ----
      case "quick-correction": quickCorrection(c); break;
      case "new-correction-card": { const reason = document.querySelector("#cor-reason").value; createCorrectionCard(c, reason); break; }
      case "analyze":
        S.actions.setCardStatus(cardId, "Enviado para análise");
        S.actions.addCreative(cardId, { type: "Vídeo enviado", source: "Upload", status: "Analisado", fileName: "video-enviado.mp4", creditsUsed: 0 });
        U.toast("Vídeo analisado pela IA ✓"); render(); break;
      case "upload-photo": {
        const inp = document.createElement("input"); inp.type = "file"; inp.accept = "image/jpeg,image/png,image/webp,image/*";
        inp.onchange = () => { const f = inp.files && inp.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { S.actions.addProductImage(cardId, { name: f.name, url: r.result, type: "image" }); U.toast("Foto do produto salva no card ✓"); refreshBody(); }; r.readAsDataURL(f); };
        inp.click(); break;
      }
      case "gen-ai-confirm": {
        const imgs = (c.content.media && c.content.media.productImages) || [];
        if (!imgs.length) return U.toast("Envie a foto do produto primeiro", "warn");
        if (cr.available < 12) return U.toast("Créditos insuficientes — compre mais", "warn");
        const primary = imgs.find((i) => i.isPrimary) || imgs[0];
        U.confirm("Essa geração consumirá 12 créditos. Deseja continuar?", () => {
          S.actions.spendCredits(12, "Vídeo IA — " + c.title);
          const tpl = (document.querySelector("#gen-tpl") || {}).value;
          const creative = Object.assign(AI.generateVideoCreativeMock(c, { template: tpl, cost: 12 }), { sourceImageId: primary.id, previewUrl: primary.url });
          S.actions.addCreative(cardId, creative);
          S.actions.setCardStatus(cardId, "Em edição");
          U.toast("Vídeo IA gerado (simulado) ✓ — 12 créditos"); refreshBody();
        }, { yes: "Gerar (12 créditos)" }); break;
      }
      case "upload-video":
        S.actions.addCreative(cardId, { type: "Vídeo enviado", source: "Upload", status: "Enviado", fileName: "meu-video.mp4", creditsUsed: 0 });
        S.actions.addFile(cardId, { name: "meu-video.mp4", type: "Vídeo bruto", size: "12 MB", ico: "🎬" });
        U.toast("Vídeo enviado ✓"); refreshBody(); break;
      case "record-take": U.toast("Gravando… (simulado)"); break;
      case "record-repeat": U.toast("Novo take"); break;
      case "record-save":
        S.actions.addCreative(cardId, { type: "Vídeo gravado", source: "Gravação no app", status: "Gravado", fileName: "take-gravado.mp4", creditsUsed: 0 });
        S.actions.addFile(cardId, { name: "take-gravado.mp4", type: "Vídeo bruto", size: "9 MB", ico: "🎬" });
        S.actions.setCardStatus(cardId, "Gravado"); U.toast("Take salvo no card ✓"); refreshBody(); break;
      case "variation":
        const vid = S.actions.addCard({ title: c.title + " — Variação", type: c.type, campaignId: c.campaignId, channel: c.channel, status: "Ideia", priority: c.priority, methods: c.methods, strategy: Object.assign({}, c.strategy), nextAction: "Testar variação" });
        U.toast("Variação criada no Board ✓"); break;
      case "published":
        S.actions.setCardStatus(cardId, "Publicado"); S.actions.patchCard(cardId, "publication.status", "Publicado"); U.toast("Marcado como publicado ✓"); refreshHead(); break;
      case "pub-approve": window.PublishEngine.approve(cardId); refreshBody(); refreshHead(); break;
      case "pub-schedule": { const p = c.publication || {}; if (!p.date) return U.toast("Defina data e hora primeiro", "warn"); window.PublishEngine.schedule(cardId); refreshBody(); refreshHead(); break; }
      case "pub-now": window.PublishEngine.publishNow(cardId, () => { render(); }); break;
      case "pub-manual": {
        U.modal({ title: "Marcar como publicado", size: "narrow", body: `<div class="field mb-0"><label>Link da publicação (opcional)</label><input class="input" id="pm-link" placeholder="https://instagram.com/p/…"/></div>`, foot: `<button class="btn btn-ghost" data-close>Cancelar</button><button class="btn btn-primary" id="pm-ok">Marcar publicado</button>`, onMount: (o) => o.querySelector("#pm-ok").onclick = () => { window.PublishEngine.markPublished(cardId, o.querySelector("#pm-link").value.trim()); U.closeModal(); refreshBody(); refreshHead(); } });
        break;
      }
      case "pub-metrics": window.PublishEngine.collectMetrics(cardId); tab = "Análise e Correção"; render(); break;
      case "correction": tab = "Análise e Correção"; render(); break;
      case "create-correction": {
        const reason = document.querySelector("#cor-reason").value;
        const note = document.querySelector("#cor-note").value || "IA gerou novo gancho, roteiro, legenda e CTA.";
        S.actions.addCorrection(cardId, { reason, note, status: "Gerou novo card" });
        const ncid = S.actions.addCard({ title: "Regravação — " + reason, type: c.type, campaignId: c.campaignId, channel: c.channel, status: "Precisa corrigir", priority: "Alta", methods: c.methods, nextAction: "Regravar aplicando correção" });
        S.actions.setCardStatus(cardId, "Virou novo teste");
        U.toast("Correção criada + card de regravação ✓"); render(); break;
      }
      case "save-metrics":
        S.actions.patchCard(cardId, "analysis.done", true);
        if (!c.analysis.summary) S.actions.patchCard(cardId, "analysis.summary", { worked: "Gancho segurou a atenção nos primeiros segundos.", failed: "CTA apareceu tarde — conversão abaixo do potencial.", repeat: "Manter o formato do gancho.", fix: "Mover CTA para o meio e mostrar produto mais cedo.", variation: "Testar mesma ideia em outro canal." });
        S.actions.setCardStatus(cardId, "Analisando resultado");
        U.toast("Métricas salvas — IA gerou diagnóstico ✓"); render(); break;
      case "new-card-analysis": case "new-caption": {
        const nid = S.actions.addCard({ title: c.title + " — Novo teste", type: c.type, campaignId: c.campaignId, channel: c.channel, status: "Ideia", nextAction: "Aplicar aprendizado" });
        U.toast("Novo card criado a partir da análise ✓"); break;
      }
      case "save-learning": S.actions.addLibrary({ type: "Aprendizado", title: "Aprendizado — " + c.title, content: c.analysis.summary ? c.analysis.summary.fix : "CTA cedo aumenta conversão.", source: cardId, tags: ["aprendizado"] }); U.toast("Aprendizado salvo ✓"); break;
      case "save-winner": S.actions.addLibrary({ type: "Gancho vencedor", title: c.script.hook || c.title, content: "Gancho que performou bem.", source: cardId, tags: ["gancho"] }); U.toast("Gancho vencedor salvo ✓"); break;
      case "copy-caption": copy(c.publication.captionFinal || c.script.caption); break;
      case "copy-hashtags": copy(c.publication.hashtagsFinal || c.script.hashtags); break;
      case "save-link": U.toast(c.publication.link ? "Link salvo ✓" : "Cole um link primeiro", c.publication.link ? "" : "warn"); break;
      case "upload-file": S.actions.addFile(cardId, { name: "arquivo-" + Math.floor(Math.random() * 900 + 100) + ".jpg", type: "Referência", size: "1.1 MB", ico: "🖼️" }); U.toast("Arquivo anexado ✓"); refreshBody(); break;
      case "analyze-again": break;
    }
  }

  function refreshHead() { const c = card(); const foot = document.querySelector(".modal-foot > div"); if (foot) foot.querySelector(".pill").outerHTML = pill(c.status); window.App.renderNav && window.App.renderNav(); }
  function copy(text) { try { navigator.clipboard.writeText(text || ""); U.toast("Copiado ✓"); } catch (e) { U.toast("Copiado ✓"); } }

  // Select helpers
  function selChannel(val, key) { const ch = ["Instagram", "TikTok", "YouTube Shorts", "Facebook", "WhatsApp", "Marketplace", "Live Shop", "Anúncios"]; return `<select class="select" ${key.startsWith("pub") ? `data-p="channel"` : `data-f="channel"`}>${ch.map((o) => `<option ${o === val ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>`; }
  function selStatus(val) { return `<select class="select" data-f="status">${S.get().statuses.map((s) => `<option ${s.name === val ? "selected" : ""}>${esc(s.name)}</option>`).join("")}</select>`; }
  function selPrio(val) { return `<select class="select" data-f="priority">${["Alta", "Média", "Baixa"].map((o) => `<option ${o === val ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>`; }

  return { open, current: () => (document.getElementById("modal-overlay") && document.querySelector(".drawer-tabs") ? cardId : null), refresh: () => { const el = document.getElementById("card-tab-body"); if (el) refreshBody(); } };
})();

</script>
  <script>
/* ============================================================
   VIRALIZA — Assistente operacional (agente do sistema)
   Entende contexto (tela/card/campanha), lê o estado, cruza
   dados e EXECUTA ações reais. Mock inteligente no MVP.
   ============================================================ */
window.Assistant = (function () {
  const S = window.Store, U = window.UI, AI = window.AI, PE = window.PublishEngine, esc = U.esc;

  // ---------- Contexto ----------
  function route() { const h = (location.hash || "#/hoje").replace(/^#\//, "").split("/"); return { view: h[0] || "hoje", param: h[1] }; }
  function getContext() {
    const st = S.get();
    const r = route();
    const cardId = (window.CardView && window.CardView.current && window.CardView.current()) || null;
    const card = cardId ? S.sel.card(cardId) : null;
    let campaignId = null;
    if (card) campaignId = card.campaignId;
    else if (r.view === "campanha") campaignId = r.param;
    const campaign = campaignId ? S.sel.campaign(campaignId) : null;
    return { view: r.view, cardId, card, campaignId, campaign, st };
  }

  function label(ctx) {
    if (ctx.card) return "Card: " + ctx.card.title;
    if (ctx.campaign) return "Campanha: " + ctx.campaign.title;
    return { hoje: "Hoje", board: "Board", analise: "Análise", biblioteca: "Biblioteca", persona: "Persona", ideias: "Ideias", campanhas: "Campanhas", config: "Configurações" }[ctx.view] || "VIRALIZA";
  }

  // Cabeçalho "Contexto atual"
  function header(ctx) {
    let rows = [];
    if (ctx.card) {
      const c = ctx.card, v = c.video || {}, camp = ctx.campaign;
      rows = [
        ["Card", c.title], camp ? ["Campanha", camp.title] : null, ["Status", c.status],
        ["Próxima ação", c.nextAction || "—"], ["Vídeos salvos", (v.versions || []).length],
        ["Análises", c.analysis && c.analysis.done ? 1 : 0], ["Correções", (c.corrections || []).length],
      ];
    } else if (ctx.campaign) {
      const cards = S.sel.cardsByCampaign(ctx.campaign.id);
      const pub = cards.filter((c) => /Publicado/.test(PE.pubStatus(c))).length;
      const best = bestCard(cards);
      rows = [
        ["Campanha", ctx.campaign.title], ["Cards", cards.length], ["Publicados", pub],
        ["Pendentes", cards.length - pub], ["Modo", ctx.campaign.publishMode || "Auto c/ aprovação"],
        best ? ["Melhor card", best.title] : null,
      ];
    } else if (ctx.view === "board") {
      const cs = ctx.st.cards;
      rows = [["Board", cs.length + " cards"], ["Pronto p/ gravar", cs.filter((c) => c.status === "Pronto para gravar").length], ["Precisa corrigir", cs.filter((c) => c.status === "Precisa corrigir").length], ["Publicados", cs.filter((c) => c.status === "Publicado").length]];
    } else if (ctx.view === "analise") {
      const done = ctx.st.cards.filter((c) => c.analysis && c.analysis.done);
      rows = [["Análises", done.length], ["Campanhas", ctx.st.campaigns.length]];
    } else {
      rows = [["Campanhas", ctx.st.campaigns.length], ["Cards", ctx.st.cards.length], ["Biblioteca", ctx.st.library.length], ["Créditos IA", ctx.st.credits.available]];
    }
    rows = rows.filter(Boolean);
    return `<div class="asst-ctx"><div class="asst-ctx-title">📍 Contexto atual</div>${rows.map(([k, v]) => `<div class="asst-ctx-row"><span>${esc(k)}</span><b>${esc(String(v))}</b></div>`).join("")}</div>`;
  }

  // Saudação por tela
  function greeting(ctx) {
    if (ctx.card) return `Estou dentro do card <b>${esc(ctx.card.title)}</b>. Posso melhorar o roteiro, gerar a fala principal, criar variação, analisar o vídeo, gerar correção ou mover o status. O que você quer?`;
    if (ctx.campaign) return `Estou lendo a campanha <b>${esc(ctx.campaign.title)}</b> (${S.sel.cardsByCampaign(ctx.campaign.id).length} cards). Posso criar novos vídeos, gerar variações, montar o plano da semana ou analisar a campanha.`;
    if (ctx.view === "board") return "Estou vendo seu board. Posso organizar os cards, encontrar atrasos/gargalos, criar tarefas ou mover publicados para análise.";
    if (ctx.view === "analise") return "Estou lendo suas análises. Posso mostrar o que funcionou, comparar cards e criar os próximos testes.";
    if (ctx.view === "biblioteca") return "Estou lendo sua biblioteca. Posso encontrar padrões vencedores para reaproveitar em novos conteúdos.";
    if (ctx.view === "hoje") return "Quer que eu organize seu dia com base nos cards, campanhas e publicações de hoje?";
    return "Oi! Sou o Assistente VIRALIZA. Me diga o que quer criar, analisar ou corrigir — eu executo dentro do sistema.";
  }

  // Botões rápidos por contexto
  function quickButtons(ctx) {
    if (ctx.card) return [["Melhorar roteiro", "improve_script"], ["Gerar fala principal", "gen_mainline"], ["Criar 5 variações", "variations:5"], ["Analisar vídeo", "analyze_video"], ["Criar correção", "create_correction"], ["Salvar na biblioteca", "save_hook"], ["Mover status", "ask_move"]];
    if (ctx.campaign) return [["Testar 10 variações", "variations:10"], ["Criar 3 vídeos", "create_cards:3"], ["Explodir vencedor", "explode_winner"], ["Plano da semana", "plan_week"], ["Analisar campanha", "summarize_campaign"]];
    if (ctx.view === "board") return [["O que fazer hoje?", "today_plan"], ["Mostrar atrasados", "show_late"], ["Criar card", "create_card"], ["Mover publicados p/ análise", "move_published"]];
    if (ctx.view === "analise") return [["O que funciona melhor?", "compare_best"], ["Ver piores", "compare_worst"], ["Criar correções", "correct_worst"], ["Salvar aprendizados", "save_learnings"]];
    if (ctx.view === "biblioteca") return [["Padrões vencedores", "lib_patterns"], ["Aplicar gancho", "lib_apply"]];
    return [["Criar campanha", "create_campaign"], ["O que fazer hoje?", "today_plan"], ["O que funciona melhor?", "compare_best"]];
  }

  // ---------- Roteamento de intenção ----------
  function reply(text, ctx) {
    const t = (text || "").toLowerCase();
    const num = (t.match(/\b(\d+)\b/) || [])[1];
    // criar N vídeos/variações (na campanha) — checar ANTES de "criar campanha"
    if (/(cria|adiciona|gera|monta).*(\d+).*(v[íi]deo|card|varia)/.test(t) && (ctx.campaign || ctx.card)) return exec("create_cards:" + (num || 3), ctx);
    if (/(varia[çc][õo]es|variar|explod).*(\d+)|(\d+).*(varia[çc][õo]es)/.test(t)) return exec("variations:" + (num || 5), ctx, { text });
    // criar campanha (cria/nova + campanha, sem número de vídeos)
    if ((/\bcria(r)?\b.*(campanha)/.test(t) || /nova campanha/.test(t)) && !num) return exec("create_campaign", ctx, { text });
    // criar card
    if (/\bcria(r)?\b.*(card|v[íi]deo)/.test(t)) return exec("create_card", ctx, { text });
    // melhorar fala principal / roteiro / gancho / cta
    if (/melhor(a|ar|e)/.test(t) && /(roteiro|fala|gancho|cta|legenda)/.test(t)) return exec("improve_script", ctx, { part: t });
    // gerar roteiro
    if (/(gera|gerar|cria|criar).*(roteiro)/.test(t)) return exec("generate_script", ctx);
    if (/fala principal/.test(t)) return exec("gen_mainline", ctx);
    if (/checklist/.test(t)) return exec("gen_checklist", ctx);
    if (/visual/.test(t)) return exec("gen_visual", ctx);
    if (/varia[çc][ãa]o|variar/.test(t)) return exec("create_variation", ctx);
    // analisar vídeo
    if (/analis(a|ar|e).*(v[íi]deo|reten)/.test(t)) return exec("analyze_video", ctx);
    // métricas / o que funciona
    if (/(funcionando melhor|funciona melhor|melhor desempenho|melhores|ranking|desempenho|compara)/.test(t)) return exec("compare_best", ctx);
    if (/piores|pior/.test(t)) return exec("compare_worst", ctx);
    // correção
    if (/(corrig|corre[çc][ãa]o|ficou fraco|refaz|regrav)/.test(t)) return exec("create_correction", ctx, { text });
    // salvar biblioteca
    if (/(salva|salvar|guarda).*(biblioteca|gancho|cta|roteiro|aprendizado|vencedor)/.test(t)) return exec("save_hook", ctx, { text });
    // mover status
    if (/(move|mover|muda|mudar|coloca).*(status|para|pra)\s+/.test(t)) return exec("move_status", ctx, { text });
    // agendar/publicar
    if (/(agenda|agendar|publica|publicar)/.test(t)) return exec(ctx.card ? "schedule" : "today_plan", ctx);
    // plano/dia
    if (/(o que.*fazer|prioridade|meu dia|organiz)/.test(t)) return exec("today_plan", ctx);
    if (/(resum|analis).*(campanha)/.test(t)) return exec("summarize_campaign", ctx);
    // fallback contextual
    return { text: fallback(ctx), actions: quickButtons(ctx).slice(0, 4).map(([l, a]) => ({ label: l, act: a })) };
  }

  function fallback(ctx) {
    if (ctx.card) return `Posso trabalhar neste card. Diga por exemplo: “melhora a fala principal”, “analisa o vídeo”, “cria correção” ou “move para pronto para gravar”.`;
    if (ctx.campaign) return `Posso trabalhar nesta campanha. Diga por exemplo: “cria mais 3 vídeos”, “monta o plano da semana” ou “analisa a campanha”.`;
    return `Me diga o que fazer — por exemplo: “cria uma campanha para vender X”, “o que está funcionando melhor?” ou “o que eu tenho que fazer hoje?”.`;
  }

  // ---------- Execução de ações reais ----------
  function exec(act, ctx, payload) {
    ctx = ctx || getContext(); payload = payload || {};
    const A = S.actions;
    const arg = act.split(":")[1];
    act = act.split(":")[0];

    switch (act) {
      case "create_campaign":
        window.CampaignWizard.open(payload.text ? { text: payload.text } : undefined);
        return { text: "Abri o criador de campanha com IA. Descreva em uma frase e eu monto a campanha + cards prontos.", actions: [] };

      case "create_cards": {
        if (!ctx.campaign) return needCampaign();
        const n = Math.max(1, Math.min(10, parseInt(arg || "3", 10)));
        const plan = AI.generateCampaignPlan({ text: ctx.campaign.productName || ctx.campaign.title, goal: ctx.campaign.type === "Afiliado" ? "Campanha de afiliado" : "Vender produto", channels: ctx.campaign.channels, audience: ctx.campaign.audience, quantity: n + " vídeos" });
        const ids = AI.generateCardsForCampaign(ctx.campaign, plan.cardPlan.slice(0, n));
        PE.buildPlan(ctx.campaign);
        refresh();
        return { text: `Criei <b>${ids.length} cards novos</b> na campanha “${esc(ctx.campaign.title)}”, já com roteiro, gancho, cena de retenção, visual e checklist. Estão no Board e no plano de publicação.`, actions: [{ label: "Ver campanha", act: "open_campaign" }, { label: "Abrir 1º card", act: "open_card", payload: ids[0] }, { label: "Gerar mais variações", act: "gen_variations" }] };
      }

      case "variations": {
        const n = parseInt(arg || "5", 10);
        if (ctx.card && !ctx.campaign) return needCampaign();
        if (ctx.card) { const ids = window.VariationMachine.explodeWinner(ctx.cardId); refresh(); return { text: `Explodi este card em <b>${ids.length} novas variações</b> (gancho, CTA, público, canal e formato diferentes) — cada uma vira card real no plano de teste.`, actions: [{ label: "Ver campanha", act: "open_campaign" }, { label: "Ver publicação", act: "open_campaign_pub" }] }; }
        if (!ctx.campaign) return needCampaign();
        const ids = window.VariationMachine.generate(ctx.campaign, n, { channels: ctx.campaign.channels });
        refresh();
        return { text: `Criei <b>${ids.length} variações distintas</b> do produto — cada uma com cenário, formato, gancho, visual e público diferentes. Já estão no Board (“Variação criada”) e no plano de teste.`, actions: [{ label: "Ver campanha", act: "open_campaign" }, { label: "Ver plano de teste", act: "open_campaign_pub" }, { label: "Abrir 1ª variação", act: "open_card", payload: ids[0] }] };
      }
      case "explode_winner": {
        if (ctx.card) { const ids = window.VariationMachine.explodeWinner(ctx.cardId); refresh(); return { text: `Marquei como <b>Vencedor</b> e gerei ${ids.length} novas variações a partir dele.`, actions: [{ label: "Ver campanha", act: "open_campaign" }] }; }
        if (!ctx.campaign) return needCampaign();
        const win = window.VariationMachine.markWinner(ctx.campaign.id);
        if (!win) return { text: "Ainda não dá para eleger um vencedor: faltam métricas nos vídeos. Publique/insira métricas e eu comparo.", actions: [{ label: "O que fazer hoje?", act: "today_plan" }] };
        const ids = window.VariationMachine.explodeWinner(win.id); refresh();
        return { text: `🏆 Vencedor: <b>${esc(win.title)}</b>. Salvei o aprendizado na biblioteca e gerei <b>${ids.length} novas variações</b> dele.`, actions: [{ label: "Ver campanha", act: "open_campaign" }, { label: "Abrir biblioteca", act: "goto", payload: "biblioteca" }] };
      }
      case "create_card": {
        const title = deriveTitle(payload.text) || "Novo vídeo";
        const camp = ctx.campaign || {};
        const tmp = { type: guessType(payload.text), campaignId: ctx.campaignId, title, strategy: {}, script: {} };
        const id = A.addCard({ title, type: tmp.type, campaignId: ctx.campaignId, status: "Pronto para gravar", nextAction: "Gravar o gancho",
          strategy: AI.generateStrategyForCard(tmp, camp), script: AI.generateScriptForCard(tmp, camp), visual: AI.generateVisualDirection(tmp, camp), checklist: AI.generateChecklistForCard(tmp, camp) });
        refresh();
        return { text: `Criei o card <b>${esc(title)}</b>${ctx.campaign ? " na campanha “" + esc(ctx.campaign.title) + "”" : ""}, já com roteiro, cena de retenção, visual, legenda e CTA.`, actions: [{ label: "Abrir card", act: "open_card", payload: id }, { label: "Gerar variação", act: "create_variation", payload: id }] };
      }

      case "improve_script": case "generate_script": case "gen_mainline": {
        if (!ctx.card) return needCard();
        const camp = ctx.campaign || {};
        const research = camp.research;
        let ns = AI.generateScriptForCard(ctx.card, camp);
        if (research && window.MarketResearch) { /* aplica base de mercado no gancho */ const scg = (research.suggestedCards || [])[0]; if (scg) { ns.hook = scg.hook; ns.screenText = [scg.screenText, "Link na bio 👆"]; } }
        if (act === "gen_mainline") { A.patchCard(ctx.cardId, "script.mainLine", ns.mainLine); }
        else if (act === "improve_script") { A.patchCard(ctx.cardId, "script.hook", "PARA TUDO 🔥 " + ns.hook.replace(/^PARA TUDO 🔥 /, "")); A.patchCard(ctx.cardId, "script.mainLine", ns.mainLine); A.patchCard(ctx.cardId, "script.cta", ns.cta); }
        else { A.updateCard(ctx.cardId, { script: ns }); }
        refresh();
        const base = research ? " Usei a inteligência de mercado salva na campanha." : "";
        return { text: `Atualizei o roteiro do card <b>${esc(ctx.card.title)}</b>.${base} Gancho e fala principal reforçados.`, actions: [{ label: "Abrir roteiro", act: "open_card_tab", payload: "Roteiro" }, { label: "Criar variação", act: "create_variation" }, { label: "Salvar gancho", act: "save_hook" }] };
      }

      case "gen_checklist": { if (!ctx.card) return needCard(); A.setChecklist(ctx.cardId, AI.generateChecklistForCard(ctx.card, ctx.campaign || {})); refresh(); return { text: "Gerei um checklist de execução para este card.", actions: [{ label: "Abrir checklist", act: "open_card_tab", payload: "Checklist" }] }; }
      case "gen_visual": { if (!ctx.card) return needCard(); A.updateCard(ctx.cardId, { visual: AI.generateVisualDirection(ctx.card, ctx.campaign || {}) }); refresh(); return { text: "Gerei a direção de visual (roupa, ambiente, enquadramento, energia da fala).", actions: [{ label: "Abrir card", act: "open_card_tab", payload: "Executar" }] }; }

      case "create_variation": {
        const id = payload || ctx.cardId; if (!id) return needCard();
        const c = S.sel.card(id); const nid = A.duplicateCard(id);
        A.updateCard(nid, { title: c.title + " — Variação", status: "Ideia", nextAction: "Testar variação", script: Object.assign({}, AI.generateScriptForCard(c, ctx.campaign || {})) });
        refresh();
        return { text: `Criei uma <b>variação</b> de “${esc(c.title)}” com novo gancho, para testar. Está no Board em “Ideia”.`, actions: [{ label: "Abrir variação", act: "open_card", payload: nid }] };
      }

      case "analyze_video": {
        if (!ctx.card) return needCard();
        const v = ctx.card.video || {};
        if (!v.versions || !v.versions.length) return { text: "Esse card ainda <b>não tem vídeo salvo</b>. Você pode gravar, enviar da galeria ou gerar com IA.", actions: [{ label: "🎥 Gravar agora", act: "open_recorder" }, { label: "📤 Enviar vídeo", act: "upload_gallery" }, { label: "✨ Gerar com IA", act: "open_card_tab", payload: "Conteúdo" }] };
        const analysis = window.MarketResearch ? null : null; // usa mock de análise
        const a = AI.analyzeUploadedVideoMock({ duration: (v.original && v.original.duration) || 22 }, ctx.card);
        S.update((s) => { const cc = s.cards.find((x) => x.id === ctx.cardId); cc.analysis = { done: true, metrics: cc.analysis.metrics || {}, summary: { worked: a.strengths.join("; "), failed: a.problems.join("; "), repeat: "Manter o gancho.", fix: a.suggestions.join("; "), variation: "Testar variação de gancho." } }; cc.publication.pubStatus = "Em análise"; });
        refresh();
        const edited = (v.versions || []).find((x) => x.kind === "Abertura Inteligente");
        return { text: `Analisei ${edited ? "a versão com <b>abertura inteligente</b>" : "o vídeo"} do card. Nota ~${a.score}. Ponto forte: ${esc(a.strengths[0])}. Melhorar: ${esc(a.problems[0])}.`, actions: [{ label: "Abrir análise", act: "open_card_tab", payload: "Análise e Correção" }, { label: "Criar correção", act: "create_correction" }, { label: "Salvar aprendizado", act: "save_learnings" }] };
      }

      case "create_correction": {
        if (!ctx.card) return needCard();
        const big = /(regrav|refaz|refaz|nova abordagem|outro p[úu]blico|novo criativo|grande)/.test((payload.text || "").toLowerCase());
        const cor = AI.generateCorrectionFromAnalysis(ctx.card, ctx.card.analysis);
        if (big) {
          const nid = A.addCard({ title: "Correção — " + cor.reason, type: ctx.card.type, campaignId: ctx.campaignId, channel: ctx.card.channel, status: "Precisa corrigir", priority: "Alta", originCardId: ctx.cardId, correctionReason: cor.reason, nextAction: "Regravar aplicando a correção", strategy: Object.assign({}, ctx.card.strategy), script: Object.assign({}, ctx.card.script, cor.correctedScript) });
          A.addCorrection(ctx.cardId, { reason: cor.reason, note: "Gerou novo card de correção (regravação).", status: "Gerou novo card" });
          refresh();
          return { text: `Essa correção exige regravação. Criei um <b>novo card de correção</b> vinculado a “${esc(ctx.card.title)}” (motivo: ${esc(cor.reason)}).`, actions: [{ label: "Abrir card de correção", act: "open_card", payload: nid }] };
        }
        A.patchCard(ctx.cardId, "script.hook", cor.correctedScript.hook);
        A.patchCard(ctx.cardId, "script.cta", cor.correctedScript.cta);
        A.addCorrection(ctx.cardId, { reason: cor.reason, note: "Correção aplicada no mesmo card (gancho/CTA).", status: "Aplicada" });
        refresh();
        return { text: `Essa correção parece pequena — apliquei uma <b>nova versão no mesmo card</b>: ${esc(cor.diagnosis)}`, actions: [{ label: "Abrir roteiro", act: "open_card_tab", payload: "Roteiro" }, { label: "Criar novo card de correção", act: "create_correction", payload: { text: "regravar" } }] };
      }

      case "save_hook": case "save_learnings": {
        if (ctx.card) {
          const c = ctx.card;
          if (act === "save_learnings" && c.analysis && c.analysis.summary) A.addLibrary({ type: "Aprendizado", title: "Aprendizado — " + c.title, content: c.analysis.summary.fix, source: c.id, tags: ["aprendizado"] });
          else A.addLibrary({ type: "Gancho vencedor", title: c.script.hook || c.title, content: "Gancho salvo do card " + c.title, source: c.id, tags: ["gancho"] });
          return { text: `Salvei na <b>Biblioteca</b>${act === "save_learnings" ? " o aprendizado" : " o gancho"} do card “${esc(c.title)}”. Vou considerar isso nas próximas gerações.`, actions: [{ label: "Abrir biblioteca", act: "goto", payload: "biblioteca" }] };
        }
        A.addLibrary({ type: "Aprendizado", title: "Aprendizado salvo", content: "Item salvo pelo assistente." });
        return { text: "Salvei na biblioteca.", actions: [{ label: "Abrir biblioteca", act: "goto", payload: "biblioteca" }] };
      }

      case "move_status": {
        if (!ctx.card) return needCard();
        const target = matchStatus(payload.text);
        if (!target) return { text: "Para qual status? Ex: “move para pronto para gravar”, “publicado”, “em edição”.", actions: S.get().statuses.slice(0, 6).map((s) => ({ label: s.name, act: "set_status", payload: s.name })) };
        A.setCardStatus(ctx.cardId, target); refresh();
        return { text: `Movi o card “${esc(ctx.card.title)}” para <b>${esc(target)}</b>.`, actions: [{ label: "Ver board", act: "goto", payload: "board" }] };
      }
      case "ask_move": return { text: "Para qual status?", actions: S.get().statuses.slice(0, 8).map((s) => ({ label: s.name, act: "set_status", payload: s.name })) };
      case "set_status": { if (!ctx.card) return needCard(); A.setCardStatus(ctx.cardId, payload); refresh(); return { text: `Status alterado para <b>${esc(payload)}</b>.`, actions: [{ label: "Ver board", act: "goto", payload: "board" }] }; }

      case "compare_best": case "compare_worst": {
        const done = S.get().cards.filter((c) => c.analysis && c.analysis.done && c.analysis.metrics && c.analysis.metrics.views);
        if (!done.length) return { text: "Ainda <b>não tenho métricas reais</b> de conteúdos publicados. Posso simular a coleta de métricas de um card publicado, ou você insere os dados na aba Análise.", actions: [{ label: "O que fazer hoje?", act: "today_plan" }] };
        const ranked = done.map((c) => ({ c, score: metricScore(c) })).sort((a, b) => act === "compare_best" ? b.score - a.score : a.score - b.score);
        const top = ranked.slice(0, 3);
        const lines = top.map((r, i) => `${i + 1}. <b>${esc(r.c.title)}</b> — ${U.fmt(r.c.analysis.metrics.views)} views · retenção ${esc(r.c.analysis.metrics.retention || "—")}`).join("<br>");
        const pattern = learnPattern(top.map((r) => r.c));
        return { text: `${act === "compare_best" ? "🏆 Melhores" : "⚠️ Piores"} conteúdos por desempenho:<br>${lines}<br><br>${pattern}`, actions: [{ label: "Salvar aprendizado", act: "save_pattern", payload: pattern }, { label: "Criar variação do topo", act: "create_variation", payload: top[0].c.id }] };
      }
      case "save_pattern": { A.addLibrary({ type: "Aprendizado", title: "Padrão vencedor", content: (payload || "Padrão identificado pelo assistente.").replace(/<[^>]+>/g, "") }); return { text: "Aprendizado salvo na biblioteca ✓. Vou usar isso ao gerar novos cards.", actions: [{ label: "Abrir biblioteca", act: "goto", payload: "biblioteca" }] }; }

      case "summarize_campaign": {
        if (!ctx.campaign) return needCampaign();
        const cards = S.sel.cardsByCampaign(ctx.campaign.id);
        const pub = cards.filter((c) => /Publicado/.test(PE.pubStatus(c)));
        const pend = cards.filter((c) => !/Publicado/.test(PE.pubStatus(c)));
        const best = bestCard(cards);
        return { text: `Campanha <b>${esc(ctx.campaign.title)}</b>: ${cards.length} cards, ${pub.length} publicados, ${pend.length} pendentes. ${best ? "Melhor card: <b>" + esc(best.title) + "</b>." : ""} Próxima ação: aprovar/agendar os pendentes.`, actions: [{ label: "Criar 3 vídeos", act: "create_cards:3" }, { label: "Plano da semana", act: "plan_week" }, { label: "Ver publicação", act: "open_campaign_pub" }] };
      }

      case "plan_week": case "gen_variations": case "audience_branches": {
        if (!ctx.campaign) return needCampaign();
        if (act === "audience_branches") { const b = AI.generateAudienceBranches(ctx.campaign.audience); b.slice(0, 5).forEach((x) => A.addLibrary({ type: "Subpúblico", title: x.name, content: `Dor: ${x.pain}. Gancho: ${x.hook}. CTA: ${x.cta}.`, tags: ["público"] })); return { text: `Gerei ${b.length} subpúblicos e salvei 5 na biblioteca (dor, gancho, CTA, plataforma).`, actions: [{ label: "Abrir biblioteca", act: "goto", payload: "biblioteca" }] }; }
        if (act === "gen_variations") { const cards = S.sel.cardsByCampaign(ctx.campaign.id).slice(0, 3); const ids = cards.map((c) => { const nid = A.duplicateCard(c.id); A.updateCard(nid, { title: c.title + " — Variação", status: "Ideia" }); return nid; }); refresh(); return { text: `Criei ${ids.length} variações dos principais cards para teste A/B.`, actions: [{ label: "Ver campanha", act: "open_campaign" }] }; }
        PE.buildPlan(ctx.campaign); refresh();
        return { text: "Montei/atualizei o <b>plano da semana</b> distribuindo os cards por dia, horário e canal.", actions: [{ label: "Ver plano", act: "open_campaign_pub" }] };
      }

      case "today_plan": {
        const cards = S.get().cards;
        const gravar = cards.filter((c) => c.status === "Pronto para gravar");
        const corrigir = cards.filter((c) => c.status === "Precisa corrigir");
        const pubHoje = PE.dueToday();
        const parts = [];
        if (pubHoje.length) parts.push(`📅 <b>${pubHoje.length}</b> publicação(ões) para hoje`);
        if (gravar.length) parts.push(`🎥 <b>${gravar.length}</b> card(s) pronto(s) para gravar`);
        if (corrigir.length) parts.push(`🛠️ <b>${corrigir.length}</b> precisa(m) de correção`);
        if (!parts.length) parts.push("Sem pendências urgentes. Que tal criar uma campanha nova?");
        return { text: "Seu dia:<br>" + parts.join("<br>"), actions: [pubHoje[0] ? { label: "Publicar 1º de hoje", act: "publish_card", payload: pubHoje[0].id } : null, gravar[0] ? { label: "Gravar 1º card", act: "open_recorder", payload: gravar[0].id } : null, { label: "Criar campanha", act: "create_campaign" }].filter(Boolean) };
      }
      case "show_late": { const late = S.get().cards.filter((c) => c.deadline && c.deadline < new Date().toISOString().slice(0, 10) && c.status !== "Publicado"); return { text: late.length ? `Cards atrasados: ${late.map((c) => "<b>" + esc(c.title) + "</b>").join(", ")}.` : "Nenhum card atrasado 👏", actions: late[0] ? [{ label: "Abrir 1º", act: "open_card", payload: late[0].id }] : [] }; }
      case "move_published": { let n = 0; S.get().cards.filter((c) => c.status === "Publicado").forEach((c) => { A.setCardStatus(c.id, "Analisando resultado"); n++; }); refresh(); return { text: `Movi ${n} card(s) publicado(s) para “Analisando resultado”.`, actions: [{ label: "Ver análise", act: "goto", payload: "analise" }] }; }
      case "correct_worst": { const worst = S.get().cards.filter((c) => c.analysis && c.analysis.done).sort((a, b) => metricScore(a) - metricScore(b))[0]; if (!worst) return { text: "Sem análises para corrigir ainda.", actions: [] }; window.App.openCard(worst.id); return { text: `Abri o card de pior desempenho (“${esc(worst.title)}”). Posso criar uma correção.`, actions: [{ label: "Criar correção", act: "create_correction" }] }; }
      case "lib_patterns": { const wins = S.get().library.filter((l) => /vencedor|Aprendizado|retenção/i.test(l.type)); return { text: wins.length ? `Padrões na biblioteca: ${wins.slice(0, 4).map((l) => "<b>" + esc(l.title) + "</b>").join(", ")}.` : "Ainda sem padrões vencedores salvos.", actions: [{ label: "Abrir biblioteca", act: "goto", payload: "biblioteca" }] }; }

      // navegação/continuidade
      case "open_campaign": window.App.render(); location.hash = "#/campanha/" + ctx.campaignId; return silent();
      case "open_campaign_pub": location.hash = "#/campanha/" + ctx.campaignId; return { text: "Abri a campanha — veja a aba <b>Publicação</b>.", actions: [] };
      case "open_card": if (payload) window.App.openCard(payload); return silent();
      case "open_card_tab": if (ctx.cardId) window.App.openCard(ctx.cardId); return silent();
      case "open_recorder": { const id = payload || ctx.cardId; if (id) window.Recorder.open(id); return silent(); }
      case "upload_gallery": if (ctx.cardId) window.VideoStudio.openUpload(ctx.cardId); return silent();
      case "publish_card": if (payload) window.PublishEngine.publishNow(payload); return { text: "Publicando (simulado)…", actions: [] };
      case "goto": location.hash = "#/" + payload; return silent();
      default: return { text: fallback(ctx), actions: [] };
    }
  }

  // ---------- helpers ----------
  function needCard() { return { text: "Abra um card primeiro — assim eu trabalho no roteiro/vídeo certo.", actions: [{ label: "Ver board", act: "goto", payload: "board" }] }; }
  function needCampaign() { return { text: "Abra uma campanha primeiro (ou peça “cria uma campanha…”).", actions: [{ label: "Ver campanhas", act: "goto", payload: "campanhas" }, { label: "Criar campanha", act: "create_campaign" }] }; }
  function silent() { return { text: "", actions: [] }; }
  function refresh() { S.persist && S.persist(); if (window.CardView && window.CardView.current && window.CardView.current()) window.CardView.refresh(); window.App && window.App.render && window.App.render(); }
  function deriveTitle(text) { if (!text) return null; const m = text.match(/(?:card|v[íi]deo)\s+(?:respondendo|sobre|de|que|para)?\s*(.+)/i); let s = m ? m[1] : text; s = s.replace(/[?.!]+$/, "").trim(); return s ? ("Vídeo — " + s.charAt(0).toUpperCase() + s.slice(1)).slice(0, 70) : null; }
  function guessType(text) { const t = (text || "").toLowerCase(); if (/antes.*depois/.test(t)) return "Antes e depois"; if (/review/.test(t)) return "Review"; if (/compar/.test(t)) return "Comparação"; if (/demonstr/.test(t)) return "Demonstração"; if (/prova/.test(t)) return "Prova social"; if (/obje[çc]|vidro|tamanho|d[úu]vida/.test(t)) return "Resposta a objeção"; return "Dor e Solução"; }
  function matchStatus(text) { const t = (text || "").toLowerCase(); return (S.get().statuses.find((s) => t.includes(s.name.toLowerCase())) || {}).name || null; }
  function metricScore(c) { const m = c.analysis.metrics || {}; const ret = parseInt(m.retention) || 0; return (m.views || 0) / 1000 + ret * 2 + (m.sales || 0) * 10 + (m.saves || 0) / 100; }
  function bestCard(cards) { const done = cards.filter((c) => c.analysis && c.analysis.done && c.analysis.metrics && c.analysis.metrics.views); if (!done.length) return null; return done.sort((a, b) => metricScore(b) - metricScore(a))[0]; }
  function learnPattern(cards) { const types = {}; cards.forEach((c) => types[c.type] = (types[c.type] || 0) + 1); const top = Object.keys(types).sort((a, b) => types[b] - types[a])[0]; return `📚 Padrão: vídeos de <b>${esc(top || "Antes e depois")}</b> vêm performando melhor. Recomendo criar mais variações desse tipo.`; }

  return { getContext, header, greeting, quickButtons, reply, exec, label };
})();

</script>
  <script>
/* ============================================================
   VIRALIZA — AIProviderService (frontend)
   Ponto único de IA. Se "Claude Real" estiver configurado e o
   backend responder, usa Claude via /api/ai/claude; senão cai
   para o MockAIEngine (window.AI / Assistant) e avisa.
   ============================================================ */
window.AIProvider = (function () {
  const S = window.Store, U = window.UI;
  function cfg() { return S.get().ai || {}; }
  function isReal() { return cfg().provider === "Claude Real"; }
  function base() { return (cfg().backendUrl || "").replace(/\/+$/, ""); } // "" = mesma origem
  function urlOf(p) { return base() + p; }

  async function status() {
    try { const r = await fetch(urlOf("/api/ai/status")); return await r.json(); }
    catch (e) { return { success: false, error: { type: "backend_error", message: String(e) } }; }
  }
  async function testConnection() {
    try { const r = await fetch(urlOf("/api/ai/test"), { method: "POST" }); return await r.json(); }
    catch (e) { return { success: false, error: { type: "backend_error", message: "Backend offline em " + (base() || "mesma origem") } }; }
  }

  function learningContext() {
    if (!window.Learning) return {};
    const m = window.Learning.getRelevantMemory("generate", {});
    return {
      approvedStyle: m.approvedStyle, rejectedStyle: m.rejectedStyle, preferredTone: m.preferredTone,
      preferredHooks: (m.approvedStyle && m.approvedStyle.hooks) || [], rejectedHooks: (m.rejectedStyle && m.rejectedStyle.hooks) || [],
      performanceInsights: m.performanceInsights,
    };
  }
  function slim(ctx) {
    ctx = ctx || {};
    const out = { view: ctx.view };
    if (ctx.campaign) out.campaign = { id: ctx.campaign.id, title: ctx.campaign.title, product: ctx.campaign.productName, objective: ctx.campaign.objective, audience: ctx.campaign.audience, channels: ctx.campaign.channels, cards: S.sel.cardsByCampaign(ctx.campaign.id).length };
    if (ctx.card) out.card = { id: ctx.card.id, title: ctx.card.title, type: ctx.card.type, status: ctx.card.status, script: ctx.card.script, hasVideo: !!(ctx.card.video && ctx.card.video.versions && ctx.card.video.versions.length), analysis: ctx.card.analysis && ctx.card.analysis.done };
    return out;
  }

  let lastError = null;
  function notifyErr(err) { lastError = err; const t = err && err.type; const msg = t === "api_key_missing" ? "Claude sem chave no backend — usando modo simulado" : t === "backend_error" ? "Backend offline — usando modo simulado" : t === "invalid_json" ? "Claude respondeu fora do formato — usando simulado" : "Erro na IA — usando modo simulado"; U.toast(msg, "warn"); }

  async function call(task, ctx, input, schema) {
    const a = cfg();
    const body = { task, context: Object.assign({ operationLearningContext: learningContext() }, slim(ctx)), input: input || {}, schema: schema || null, model: a.model, temperature: a.temperature, maxTokens: a.maxTokens };
    const r = await fetch(urlOf("/api/ai/claude"), { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    return await r.json();
  }

  // Tenta Claude; se falhar/indisponível, executa o fallback (mock) e marca a origem.
  async function withClaude(task, ctx, input, mockFn) {
    if (isReal()) {
      try {
        const r = await call(task, ctx, input);
        if (r && r.success) return { source: "claude", ...r };
        notifyErr((r && r.error) || { type: "backend_error" });
      } catch (e) { notifyErr({ type: "backend_error", message: String(e) }); }
    }
    return { source: "mock", ...mockFn() };
  }

  // ---- API de alto nível (todas retornam Promise) ----
  async function assistantReply(message, ctx) {
    return withClaude("assistant_action", ctx, { message }, () => {
      const m = window.Assistant.reply(message, ctx);
      return { reply: m.text, actions: (m.actions || []).map((a) => ({ type: "assistant_op", payload: { act: a.act, label: a.label, payload: a.payload } })), learningUsed: [] };
    });
  }
  async function generateScript(card, ctx) { return withClaude("generate_script", ctx, { cardId: card && card.id }, () => ({ data: { script: window.AI.generateScriptForCard(card, ctx && ctx.campaign || {}) }, reply: "Roteiro gerado (simulado).", actions: [], learningUsed: [] })); }
  async function generateVariations(input, ctx) { return withClaude("generate_variations", ctx, input, () => ({ reply: "Variações geradas (simulado).", actions: [], learningUsed: [] })); }
  async function generateCampaign(input, ctx) { return withClaude("generate_campaign", ctx, input, () => ({ data: { plan: window.AI.generateCampaignPlan(input) }, reply: "Campanha planejada (simulado).", actions: [], learningUsed: [] })); }
  async function analyzeContent(card, ctx) { return withClaude("analyze_content", ctx, { cardId: card && card.id }, () => ({ data: { analysis: window.AI.analyzeUploadedVideoMock({ duration: 22 }, card) }, reply: "Análise (simulada).", actions: [], learningUsed: [] })); }
  async function createPublicationPlan(campaign, ctx) { return withClaude("create_publication_plan", ctx, { campaignId: campaign && campaign.id }, () => { window.PublishEngine.buildPlan(campaign); return { reply: "Plano montado (simulado).", actions: [], learningUsed: [] }; }); }

  // Executa actions[] que o Claude retornar (Frontend executa ação real)
  function executeActions(actions, ctx) {
    let done = 0;
    (actions || []).forEach((a) => {
      const p = a.payload || {};
      try {
        if (a.type === "assistant_op") { window.Assistant.exec(p.act, ctx, p.payload); done++; }
        else if (a.type === "create_campaign") { const plan = window.AI.generateCampaignPlan(p); const id = S.actions.addCampaign(plan); window.AI.generateCardsForCampaign(S.sel.campaign(id), plan.cardPlan); done++; }
        else if (a.type === "create_cards" && ctx.campaign) { window.AI.generateCardsForCampaign(ctx.campaign, (p.cards || [])); done++; }
        else if (a.type === "create_variations" && ctx.campaign) { window.VariationMachine.generate(ctx.campaign, p.count || 10, { channels: p.channels, styles: p.styles }); done++; }
        else if (a.type === "generate_script" && ctx.card) { if (p.script) S.actions.updateCard(ctx.card.id, { script: p.script }); done++; }
        else if (a.type === "create_publication_plan" && ctx.campaign) { window.PublishEngine.buildPlan(ctx.campaign); done++; }
        else if (a.type === "move_status" && ctx.card && p.status) { S.actions.setCardStatus(ctx.card.id, p.status); done++; }
        else if (a.type === "save_to_library") { S.actions.addLibrary({ type: p.libType || "Aprendizado", title: p.title || "Item", content: p.content || "" }); done++; }
      } catch (e) { /* ignora action inválida */ }
    });
    return done;
  }

  function lastErr() { return lastError; }
  return { isReal, base, status, testConnection, call, withClaude, assistantReply, generateScript, generateVariations, generateCampaign, analyzeContent, createPublicationPlan, executeActions, learningContext, lastErr };
})();

</script>
  <script>
/* ============================================================

   ============================================================ */
window.App = (function () {
  const S = window.Store, U = window.UI, V = window.Views, esc = U.esc;

  function currentRoute() {
    const h = (location.hash || "#/hoje").replace(/^#\//, "");

  // ---------- Layout ----------
  function renderNav() {
    const st = S.get();

      <div class="nav-item ${view === n.key || (view === "campanha" && n.key === "campanhas") ? "active" : ""}" data-nav="${n.key}">
        <span class="ico">${n.ico}</span><span>${n.label}</span>${counts[n.key] != null ? `<span class="badge">${counts[n.key]}</span>` : ""}
      </div>`).join("");

    document.getElementById("sidebar").innerHTML = `
      <div class="brand" data-nav="hoje">
        <div class="brand-logo">V</div>
        <div><div class="brand-name">VIRALIZA</div><div class="brand-sub">Execução de conteúdo</div></div>
      </div>
      <div class="nav">
        <div class="nav-label">Operação</div>${items}
      </div>
      <div class="sidebar-foot">
        <div class="credits-mini" data-nav="config" data-settab="Créditos de IA">
          <div class="cm-top"><span>✨ Créditos IA</span><span class="cm-val">${st.credits.available}/${st.credits.total}</span></div>
          <div class="bar"><span style="width:${pct}%"></span></div>

    document.querySelectorAll("#sidebar [data-nav]").forEach((el) => el.onclick = () => { location.hash = "#/" + el.dataset.nav; document.getElementById("sidebar").classList.remove("open"); });
  }

  function renderHeader() {
    const { view, param } = currentRoute();
    const titles = { hoje: ["Hoje", "sua central de execução"], ideias: ["Ideias", "capture e transforme"], campanhas: ["Campanhas", "estratégia → execução"], campanha: ["Campanha", ""], board: ["Board", "produção de conteúdo"], analise: ["Análise", "performance e correção"], biblioteca: ["Biblioteca", "acervo reutilizável"], persona: ["Persona", "identidade da marca"], config: ["Configurações", ""] };
    const [t, sub] = titles[view] || ["VIRALIZA", ""];
    document.getElementById("header").innerHTML = `
      <div class="menu-toggle" id="menu-toggle">☰</div>
      <div><h1>${esc(t)}</h1></div><span class="sub">${esc(sub)}</span>
      <div class="header-spacer"></div>
      <div class="header-search">🔍<input placeholder="Buscar ideias, campanhas, cards…" id="global-search"/></div>
      <button class="btn btn-primary btn-sm" id="header-new">+ Criar</button>`;
    document.getElementById("menu-toggle").onclick = () => document.getElementById("sidebar").classList.toggle("open");
    document.getElementById("header-new").onclick = () => openCreateMenu();
    const gs = document.getElementById("global-search");
    gs.onkeydown = (e) => { if (e.key === "Enter" && gs.value.trim()) globalSearch(gs.value.trim()); };
  }

  // ---------- Main render ----------
  function render() {
    renderNav(); renderHeader();
    const { view, param } = currentRoute();
    const content = document.getElementById("content");
    let html, binder;
    switch (view) {
      case "hoje": html = V.hoje(); binder = V.bindHoje; break;
      case "ideias": html = V.ideias(); binder = V.bindIdeias; break;
      case "campanhas": html = V.campanhas(); binder = V.bindCampanhas; break;
      case "campanha": html = V.campanha(param); binder = V.bindCampanha; break;
      case "board": html = V.board(); binder = V.bindBoard; break;
      case "analise": html = V.analise(); binder = V.bindAnalise; break;
      case "biblioteca": html = V.biblioteca(); binder = V.bindBiblioteca; break;
      case "persona": html = V.persona(); binder = V.bindPersona; break;
      case "config": html = V.config(); binder = V.bindConfig; break;
      default: location.hash = "#/hoje"; return;
    }
    content.innerHTML = html;
    if (binder) binder(content);
    content.scrollTop = 0;
    U.renderChat();
  }

  // ---------- Openers ----------
  function openCard(id) { window.CardView.open(id); }
  function openIdea(id) {
    const i = S.sel.idea(id);
    U.modal({
      title: i.title, size: "",
      body: `
        <div class="flex gap-8 wrap" style="margin-bottom:14px">${U.statusPill(i.status)} ${i.aiClass ? `<span class="pill pill-accent">🏷️ ${esc(i.aiClass)}</span>` : ""} <span class="muted">${esc(i.source)}</span></div>
        <div class="field"><label>Descrição</label><textarea class="textarea" id="idea-desc">${esc(i.description)}</textarea></div>
        <div class="info-block"><h4>🤖 Classificação da IA</h4><p class="muted">${esc(i.aiNotes || "A IA pode classificar como venda, autoridade, prova social, review, comparação, afiliado e mais.")}</p></div>
        <div class="field mb-0"><label>Tags</label><div class="tag-row">${(i.tags || []).map((t) => `<span class="pill pill-gray">#${esc(t)}</span>`).join("") || '<span class="muted">—</span>'}</div></div>`,
      foot: `
        <button class="btn btn-ghost btn-sm" data-ia="delete">Excluir</button>
        <button class="btn btn-sm" data-ia="card">→ Virar card</button>

      onMount: (o) => {
        o.querySelector("#idea-desc").onchange = (e) => S.actions.updateIdea(id, { description: e.target.value });
        o.querySelector("[data-ia='delete']").onclick = () => U.confirm("Excluir ideia?", () => { S.actions.deleteIdea(id); U.closeModal(); U.toast("Ideia excluída"); render(); }, { danger: true, yes: "Excluir" });
        o.querySelector("[data-ia='card']").onclick = () => { const cid = S.actions.addCard({ title: i.title, objective: i.description.slice(0, 60), nextAction: "Gerar roteiro" }); S.actions.updateIdea(id, { status: "Virou card" }); U.closeModal(); U.toast("Ideia virou card ✓"); openCard(cid); };
        o.querySelector("[data-ia='lib']").onclick = () => { S.actions.addLibrary({ type: "Aprendizado", title: i.title, content: i.description, tags: i.tags }); U.toast("Salvo na biblioteca ✓"); };
        o.querySelector("[data-ia='camp']").onclick = () => { U.closeModal(); openCampaignForm(null, { title: i.title, objective: i.description.slice(0, 80) }); };
      },
    });
  }

  // ---------- Forms ----------
  function field(label, id, val, ph, type) { return `<div class="field"><label>${esc(label)}</label><input class="input" id="${id}" value="${esc(val || "")}" placeholder="${esc(ph || "")}" ${type ? `type="${type}"` : ""}/></div>`; }
  function textField(label, id, val, ph) { return `<div class="field"><label>${esc(label)}</label><textarea class="textarea" id="${id}" placeholder="${esc(ph || "")}">${esc(val || "")}</textarea></div>`; }
  function selField(label, id, opts, val) { return `<div class="field"><label>${esc(label)}</label><select class="select" id="${id}">${opts.map((o) => `<option ${o === val ? "selected" : ""}>${esc(o)}</option>`).join("")}</select></div>`; }

  function openIdeaForm() {
    U.modal({
      title: "Nova ideia", size: "",
      body: `${field("Título", "if-title", "", "Ex: Cliente reclamou que perde tampa de pote")}
        ${textField("Descrição", "if-desc", "", "Descreva a ideia, comentário, tendência…")}
        ${selField("Origem", "if-source", ["Comentário", "Bastidor", "Tendência", "Pergunta de cliente", "Ideia de oferta", "Ideia de roteiro", "Referência", "Produto", "Chat IA"], "Comentário")}
        ${field("Tags (separadas por vírgula)", "if-tags", "", "dor, cozinha, afiliado")}`,
      foot: `<button class="btn btn-ghost" data-close>Cancelar</button><button class="btn btn-primary" id="if-save">Criar ideia</button>`,
      onMount: (o) => o.querySelector("#if-save").onclick = () => {
        const title = o.querySelector("#if-title").value.trim(); if (!title) return U.toast("Digite um título", "warn");
        S.actions.addIdea({ title, description: o.querySelector("#if-desc").value, source: o.querySelector("#if-source").value, tags: o.querySelector("#if-tags").value.split(",").map((t) => t.trim()).filter(Boolean), aiClass: "venda", aiNotes: "A IA sugere trabalhar o gancho de retenção nos primeiros segundos." });
        U.closeModal(); U.toast("Ideia criada ✓"); render();
      },
    });
  }

  const CAMPAIGN_TYPES = ["Conteúdo orgânico", "Afiliado", "Produto físico", "Infoproduto", "Marketplace", "Live Shop", "Lançamento", "Prova social", "Antes e depois", "Review", "Comparação", "Oferta", "Autoridade", "Comunidade", "Anúncio pago"];
  const ALL_CHANNELS = ["Instagram", "TikTok", "YouTube Shorts", "Facebook", "WhatsApp", "Marketplace", "Live Shop", "Anúncios"];

  function openCampaignForm(id, prefill) {
    // Nova campanha = fluxo conversacional com IA. Editar = form avançado.
    if (!id) { window.CampaignWizard.open(prefill); return; }
    const c = id ? S.sel.campaign(id) : Object.assign({ channels: [], type: "Afiliado" }, prefill || {});
    U.modal({
      title: id ? "Editar campanha" : "Nova campanha", size: "wide",
      body: `<div class="grid grid-2" style="align-items:start">
        <div>
          ${field("Nome da campanha", "cf-title", c.title, "Ex: Afiliado — Potes Herméticos")}
          ${selField("Tipo de campanha", "cf-type", CAMPAIGN_TYPES, c.type)}

          ${field("Oferta", "cf-offer", c.offer, "Ex: Kit por R$ 89,90 frete grátis")}
          ${field("Público", "cf-audience", c.audience, "Quem vai comprar")}
          ${field("Promessa central", "cf-promise", c.promise, "O que você promete")}
          ${field("Emoção principal", "cf-emotion", c.emotion, "Ex: Alívio, urgência")}
          ${field("CTA principal", "cf-cta", c.cta, "Ex: Compra pelo link da bio")}
        </div>
        <div>
          <div id="cf-aff" style="${c.type === "Afiliado" ? "" : "display:none"}">
            <div class="info-block"><h4>🔗 Dados de afiliado</h4>
              ${field("Link de afiliado", "cf-link", c.affiliateLink, "https://…")}
              <div class="form-row">${field("Comissão", "cf-commission", c.commission, "18%")}${field("Preço", "cf-price", c.price, "R$ 89,90")}</div>

      foot: `<button class="btn btn-ghost" data-close>Cancelar</button><button class="btn btn-primary" id="cf-save">${id ? "Salvar" : "Criar campanha"}</button>`,
      onMount: (o) => {
        const chips = []; o.querySelectorAll("#cf-channels .chip").forEach((ch) => ch.onclick = () => ch.classList.toggle("on"));
        o.querySelector("#cf-type").onchange = (e) => { o.querySelector("#cf-aff").style.display = e.target.value === "Afiliado" ? "" : "none"; };
        o.querySelector("#cf-save").onclick = () => {
          const g = (x) => { const el = o.querySelector("#cf-" + x); return el ? el.value : ""; };

          const data = { title: g("title") || "Nova campanha", type: g("type"), objective: g("objective"), productName: g("product"), offer: g("offer"), audience: g("audience"), promise: g("promise"), emotion: g("emotion"), cta: g("cta"), affiliateLink: g("link"), commission: g("commission"), price: g("price"), platform: g("platform"), dor: g("dor"), objections: g("objections"), proofs: g("proofs"), bonus: g("bonus"), channels, startDate: g("start"), endDate: g("end"), videosPerDay: Number(g("videos")) || 2 };
          if (id) { S.actions.updateCampaign(id, data); U.closeModal(); U.toast("Campanha atualizada ✓"); render(); }
          else { const nid = S.actions.addCampaign(data); U.closeModal(); U.toast("Campanha criada ✓"); location.hash = "#/campanha/" + nid; }
        };
